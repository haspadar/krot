[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
interpreter_python = auto_silent
; The standalone yaml callback was removed in community.general 12; this is its
; supported replacement.
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
forks = 10
# Facts are re-gathered on every run: playbooks here are rare and correctness of
# distribution/version checks matters more than the few seconds caching saves.
gathering = smart
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[privilege_escalation]
become = True
become_method = sudo
become_user = root
