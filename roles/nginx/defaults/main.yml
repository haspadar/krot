---
# Server-level configuration only: this role never enumerates sites or domains.
# Rendering per-site vhosts belongs to whatever provisions the sites themselves.
nginx_worker_processes: auto
nginx_worker_connections: 1024
nginx_keepalive_timeout: 65
nginx_client_max_body_size: 16M

# Name of the log_format the vhosts reference. Override it to match whatever
# name the site configs expect.
nginx_log_format_name: krot
# JSON lines: a shipper reads them without a custom parser, and adding a field
# later does not break whatever already reads the old ones.
nginx_log_json: true
nginx_log_retention_days: 14

# Restores the visitor's address from CF-Connecting-IP. Without it every hit is
# logged as Cloudflare and the impression stats become meaningless.
nginx_real_ip_from_cloudflare: true
nginx_real_ip_header: CF-Connecting-IP

nginx_server_tokens: "off"

# Deployer writes releases here; Ansible only owns the directory and its
# permissions, never its contents.
nginx_deploy_root: ""
nginx_deploy_user: km
