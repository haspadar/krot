---
# Server-level configuration only: this role never enumerates sites or domains.
# Rendering per-site vhosts belongs to whatever provisions the sites themselves.
nginx_worker_processes: auto
nginx_worker_connections: 1024
nginx_keepalive_timeout: 65
nginx_client_max_body_size: 16M

# Settings nginx accepts only once per machine. Both off by default so the role
# is safe on a machine that is not behind Cloudflare; both on for a machine whose
# sites all are. The log format stays with the site generator: it knows the name
# its vhosts reference, and each network names its own.
#
# Real-IP: set_real_ip_from for Cloudflare's ranges, refreshed daily by a timer,
# plus real_ip_header CF-Connecting-IP. A stale range list does not fail — it
# logs every visitor behind the new range as the CDN.
nginx_cloudflare_real_ip: false
nginx_real_ip_conf: /etc/nginx/conf.d/krot-real-ip.conf
nginx_cloudflare_ipv4_url: https://www.cloudflare.com/ips-v4
nginx_cloudflare_ipv6_url: https://www.cloudflare.com/ips-v6
# Fewer than this is treated as a truncated answer and refused (22 as of 2026-09).
nginx_cloudflare_min_ranges: 10
nginx_cloudflare_refresh_hour: "5"

# A server answering 444 on 80 and 443 for every hostname no vhost claims.
nginx_default_server: false
# From the ssl-cert package: the default server only finishes the handshake
# before closing, so no site's certificate is needed or wanted here.
nginx_default_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
nginx_default_certificate_key: /etc/ssl/private/ssl-cert-snakeoil.key

# Applied by editing the nginx package's own logrotate config, not by shipping a
# second one: logrotate accepts exactly one entry per log file and aborts the
# entire run — every service on the machine — when it finds two.
nginx_log_retention_days: 14

nginx_server_tokens: "off"

# Basic auth guarding sites that are not published yet. This role only installs
# the password file and a snippet; whether a given vhost includes that snippet is
# the site generator's call, so a site can be opened one at a time.
#
#   include /etc/nginx/snippets/krot-auth.conf;
#
# Krot deliberately does not decide which sites are published: that list lives
# with the project that owns the sites.
nginx_auth_enabled: false
nginx_auth_realm: Preview
nginx_auth_user: preview
# Plain password; the role hashes it on the host so the hash never has to be
# stored anywhere. Supply it from a secret store, never from a committed file.
nginx_auth_password: ""

# Deployer writes releases here; Ansible only owns the directory and its
# permissions, never its contents.
nginx_deploy_root: ""
nginx_deploy_user: km
