---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

# No `validate:` here on purpose. It would test the file from Ansible's temp
# directory, and nginx resolves relative includes (fastcgi_params in the
# generated vhosts) against the config's own directory — so a perfectly good
# config fails. `backup: true` plus the verify handler covers it instead: the
# handler tests the assembled config in place and fails the play before any
# reload, leaving the timestamped backup to restore from.
- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx

# The log format and real-IP restoration used to live here. They belong to
# whatever generates the vhosts: it knows which format name they reference, and
# it can refresh the Cloudflare ranges every time it regenerates rather than only
# when a provisioning run happens. Two writers for one setting drift apart, and
# an outdated set_real_ip_from silently logs every visitor as the CDN.
- name: Drop settings the site generator now owns
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/krot-real-ip.conf
  notify: Reload nginx

- name: Find log formats this role used to write
  ansible.builtin.find:
    paths: /etc/nginx/conf.d
    patterns: "*-log-format.conf"
  register: nginx_stale_formats

- name: Drop log formats this role used to write
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nginx_stale_formats.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reload nginx

- name: Drop the default site
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ item }}"
    state: absent
  loop:
    - default
  notify: Reload nginx

- name: Provide basic auth for unpublished sites
  ansible.builtin.include_tasks: auth.yml
  when: nginx_auth_enabled

- name: Include the vhost permission tasks
  ansible.builtin.include_tasks: vhosts.yml

- name: Rotate the nginx logs
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/krot-nginx
    owner: root
    group: root
    mode: "0644"

- name: Enable nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
