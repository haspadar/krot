---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

# No `validate:` here on purpose. It would test the file from Ansible's temp
# directory, and nginx resolves relative includes (fastcgi_params in the
# generated vhosts) against the config's own directory — so a perfectly good
# config fails. `backup: true` plus the verify handler covers it instead: the
# handler tests the assembled config in place and fails the play before any
# reload, leaving the timestamped backup to restore from.
- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx

# The log format and real-IP restoration used to live here. They belong to
# whatever generates the vhosts: it knows which format name they reference, and
# it can refresh the Cloudflare ranges every time it regenerates rather than only
# when a provisioning run happens. Two writers for one setting drift apart, and
# an outdated set_real_ip_from silently logs every visitor as the CDN.
- name: Drop settings the site generator now owns
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/conf.d/krot-real-ip.conf
  notify: Reload nginx

- name: Find log formats this role used to write
  ansible.builtin.find:
    paths: /etc/nginx/conf.d
    patterns: "*-log-format.conf"
  register: nginx_stale_formats

- name: Drop log formats this role used to write
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nginx_stale_formats.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reload nginx

- name: Drop the default site
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ item }}"
    state: absent
  loop:
    - default
  notify: Reload nginx

- name: Provide basic auth for unpublished sites
  ansible.builtin.include_tasks: auth.yml
  when: nginx_auth_enabled

- name: Include the vhost permission tasks
  ansible.builtin.include_tasks: vhosts.yml

# The nginx package already rotates /var/log/nginx/*.log, and logrotate refuses
# to run at all when two files claim the same log: it reports "duplicate log
# entry", exits 1 and rotates NOTHING on the machine — including postgresql and
# krot-php, which are blameless. Measured on busel 2026-08-13: three days of a
# failed logrotate.service and no rotation anywhere.
#
# The duplicate is detected on the resolved path, not on the glob text, so no
# rewording of the pattern avoids it. This role therefore stops shipping a
# second file and adjusts retention inside the package's own.
- name: Drop the rotation config this role used to ship
  ansible.builtin.file:
    path: /etc/logrotate.d/krot-nginx
    state: absent

- name: Read the packaged rotation config
  ansible.builtin.slurp:
    src: /etc/logrotate.d/nginx
  register: nginx_packaged_logrotate
  # A machine without the package file has nothing to edit; the assert below
  # turns that into a stated fact rather than a silently skipped task.
  failed_when: false

# Editing the package's file rather than shipping our own, because logrotate
# allows exactly one entry per log.
#
# `replace`, not `lineinfile`: the latter appends its line when the pattern is
# absent, and a `rotate` landing after the closing brace is not an error
# logrotate reports — measured, it simply drops the directive and rotates with
# no retention at all, deleting yesterday's log instead of keeping fourteen.
# `lineinfile` also edits only the last match, so a file with a block per log
# would get one block updated and the rest silently left behind.
- name: Set the nginx log retention
  ansible.builtin.replace:
    path: /etc/logrotate.d/nginx
    regexp: '^(\s*)rotate\s+\d+\s*$'
    replace: '\g<1>rotate {{ nginx_log_retention_days }}'
  when: nginx_rotate_anchor_present

# Saying so beats leaving it out: retention that quietly does not apply is the
# class of defect this file is being changed to remove.
- name: Assert the retention setting could be applied
  ansible.builtin.assert:
    that: nginx_rotate_anchor_present
    fail_msg: >-
      /etc/logrotate.d/nginx has no `rotate N` line to adjust
      (missing file, or a package that words it differently), so
      nginx_log_retention_days cannot be honoured. Krot will not add a second
      rotation config: logrotate stops rotating every log on the machine when
      two configs claim one file.
    quiet: true

- name: Enable nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
