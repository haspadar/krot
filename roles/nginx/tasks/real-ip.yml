---
# The firewall role writes this file, and reusing it keeps nginx and ufw agreeing
# on what "Cloudflare" means. It may be absent when nginx is applied on its own.
- name: Look for the ranges maintained by the firewall role
  ansible.builtin.stat:
    path: /etc/krot/cloudflare-ranges.txt
  register: nginx_cf_stat

- name: Read the ranges maintained by the firewall role
  ansible.builtin.slurp:
    src: /etc/krot/cloudflare-ranges.txt
  register: nginx_cf_file
  when: nginx_cf_stat.stat.exists

- name: Fetch the Cloudflare ranges when the firewall role has not run
  ansible.builtin.uri:
    url: "{{ item }}"
    return_content: true
  loop:
    - https://www.cloudflare.com/ips-v4
    - https://www.cloudflare.com/ips-v6
  register: nginx_cf_fetch
  when: not nginx_cf_stat.stat.exists
  # Read-only, so it runs under --check too; without this the assert below has
  # nothing to inspect and a check run fails on a healthy configuration.
  check_mode: false

- name: Assert the range list is usable
  ansible.builtin.assert:
    that:
      - nginx_cloudflare_ranges | length >= 10
    fail_msg: >-
      No usable Cloudflare range list. Writing real_ip_header without
      set_real_ip_from would let any client spoof its address through
      {{ nginx_real_ip_header }}.
    quiet: true

- name: Write the real-IP configuration
  ansible.builtin.template:
    src: real-ip.conf.j2
    dest: /etc/nginx/conf.d/krot-real-ip.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
