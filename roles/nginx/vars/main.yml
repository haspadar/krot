---
# Prefers the file the firewall role maintains, falling back to a direct fetch so
# the nginx role can also be applied on its own.
#
# The fetched bodies are each trimmed and split on their own before being
# combined: the v4 response carries no trailing newline, so joining the texts
# first would fuse its last range onto the first v6 one.
nginx_cloudflare_ranges: >-
  {{ ((nginx_cf_file.content | b64decode).splitlines()
      if (nginx_cf_file.content is defined)
      else (nginx_cf_fetch.results | default([]) | map(attribute='content')
            | map('trim') | list | join(nginx_newline)).splitlines())
     | map('trim') | select('search', '/') | list }}

# A literal newline: YAML escapes stay literal inside the folded scalar above.
nginx_newline: "\n"
