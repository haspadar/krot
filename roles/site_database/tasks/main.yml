---
# The site's own database. Included only by a project whose sites each have
# one; gudok, with one database for all its sites, does not include it.

# Included but not named is the dangerous case, not a harmless skip: the site
# would then be pointed at whatever database the project's config falls back
# to — on busel, the machine's first site — and share it silently.
- name: Refuse to run without a database name and owner
  ansible.builtin.assert:
    that:
      - site_database_name | length > 0
      - site_database_owner | length > 0
    fail_msg: >-
      site_database is included for {{ site_domain }} but site_database_name or
      site_database_owner is empty. Name them, or leave the role out.
    quiet: true

- name: Look for the owner role in the cluster
  community.postgresql.postgresql_query:
    login_db: postgres
    query: SELECT 1 FROM pg_roles WHERE rolname = %(owner)s
    named_args:
      owner: "{{ site_database_owner }}"
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: site_database_owner_row

- name: Refuse to create a database for an owner that does not exist
  ansible.builtin.assert:
    that: site_database_owner_row.rowcount == 1
    fail_msg: "Role {{ site_database_owner }} is not in the cluster; the project creates it, not this role."
    quiet: true

# By the catalogue rather than by connecting: a failed connection is not a
# missing database, and treating it as one would try to create a second.
# Created owned by the site's role rather than by postgres, so the application
# can run its own migrations.
- name: Create the database, owned by the site's role
  community.postgresql.postgresql_db:
    name: "{{ site_database_name }}"
    owner: "{{ site_database_owner }}"
  become: true
  become_user: postgres
