---
# Everything the inventory can get wrong is refused here, before the machine is
# touched: a unit installed over a malformed entry is a night that fails at
# 01:00, or worse, one that runs green over nothing.
#
# ⚠️ Loops walk indexing_plans, the projects without their keys: a failed item
# is printed whole whatever its label says.
#
# \Z, not $: Python's $ also matches before a final newline, and a value from a
# YAML `|` block would pass carrying one.
- name: Assert each project is usable
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9]+\Z')
      - item.database | length > 0
      - item.reader | length > 0
      - item.engines | length > 0
      - item.engines | difference(indexing_engines) | length == 0
      - item.engines | unique | length == item.engines | length
      - item.sites | length > 0
    fail_msg: >-
      Project {{ item.name }} needs a name of [a-z0-9]+ (it is read back out of
      krot-index-<project>-<engine>, so no dash), a database, a reader, a list of
      engines out of {{ indexing_engines | join(', ') }} and at least one site.
    quiet: true
  loop: "{{ indexing_plans }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert a retired project is named and not also declared
  ansible.builtin.assert:
    that:
      # A string: an unquoted 1 in YAML is an int, passes the pattern as text,
      # and then matches no parsed name — retiring nothing, green.
      - item is string
      - item is match('^[a-z0-9]+\Z')
      - item not in indexing_projects
    fail_msg: >-
      {{ item }} is in indexing_retired_projects but is not a project name, or is
      still declared in indexing_projects. A project is either run or taken off.
    quiet: true
  loop: "{{ indexing_retired_projects }}"

- name: Assert each site names a domain and a sitemap
  ansible.builtin.assert:
    that:
      - item.1.domain | default('') | length > 0
      - item.1.sitemap_url | default('') is match('^https?://')
    fail_msg: "A site of {{ item.0.name }} needs a domain and an http(s) sitemap_url."
    quiet: true
  loop: "{{ indexing_plans | subelements('sites') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1.domain | default('<unnamed>') }}"

# A site's own `engines` narrows the project's: the site is left out of the units of the rest.
# Refused when it is not a list, is empty, repeats an engine or names one the project does not
# declare — each reads as a decision and would be a silent one — and when an engine of the
# project is offered to no site, whose unit would run over nothing and turn red every night.
- name: Assert each site's engines are a subset of its project's
  ansible.builtin.assert:
    that:
      - item.1.engines is not defined or item.1.engines is sequence
      - item.1.engines is not defined or (item.1.engines is not string and item.1.engines is not mapping)
      - item.1.engines is not defined or item.1.engines | length > 0
      - item.1.engines is not defined or item.1.engines | unique | length == item.1.engines | length
      - item.1.engines is not defined or item.1.engines | difference(item.0.engines) | length == 0
    fail_msg: >-
      A site of {{ item.0.name }} lists engines that are not a non-empty list of distinct engines
      out of the project's own ({{ item.0.engines | join(', ') }}). Leave the field out to offer the
      site to all of them.
    quiet: true
  loop: "{{ indexing_plans | subelements('sites') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1.domain | default('<unnamed>') }}"

- name: Assert every declared engine is offered to a site
  ansible.builtin.assert:
    that:
      - indexing_offered | length > 0
    fail_msg: >-
      {{ item.0.name }} declares {{ item.1 }} but every site's engines leave it out. Drop the
      engine from the project, or let a site use it.
    quiet: true
  vars:
    indexing_offered: >-
      {%- set found = [] -%}
      {%- for site in item.0.sites -%}
      {%- if item.1 in site.engines | default(item.0.engines) -%}
      {%- set _ = found.append(site.domain) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ found }}
  loop: "{{ indexing_plans | subelements('engines') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

# Bing accounts: a site that lives in another Bing Webmaster account names it, and the project
# holds that account's key under `bing_accounts`. Every shape that would read as a decision and
# be a silent one is refused: a name the unit's variable cannot carry, an account that no
# site uses (a key left on the machine for nothing), a site naming an account the project
# does not hold or one it is not offered to Bing under.
- name: Assert each project's Bing accounts are named and bound to Bing
  ansible.builtin.assert:
    that:
      - item.bing_accounts_is_mapping
      - item.bing_accounts | length == 0 or 'bing' in item.engines
      - item.bing_accounts | select('string') | list | length == item.bing_accounts | length
      - item.bing_accounts | reject('match', '^[a-z0-9]+\Z') | list | length == 0
    fail_msg: >-
      {{ item.name }}: bing_accounts must be a mapping of account name ([a-z0-9]+) to key, and only
      for a project that declares bing.
    quiet: true
  loop: "{{ indexing_plans }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert each site names a Bing account its project holds
  ansible.builtin.assert:
    that:
      - item.1.bing_account is not defined
        or (item.1.bing_account is string and item.1.bing_account in item.0.bing_accounts
            and 'bing' in item.1.engines | default(item.0.engines))
    fail_msg: >-
      A site of {{ item.0.name }} ({{ item.1.domain | default('<unnamed>') }}) names a bing_account that
      the project's bing_accounts ({{ item.0.bing_accounts | join(', ') | default('none', true) }}) does not
      hold, or is not offered to bing.
    quiet: true
  loop: "{{ indexing_plans | subelements('sites') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1.domain | default('<unnamed>') }}"

- name: Assert every Bing account is used by a site
  ansible.builtin.assert:
    that:
      - item.1 in item.0.sites | selectattr('bing_account', 'defined') | map(attribute='bing_account') | list
    fail_msg: >-
      {{ item.0.name }} holds a key for the Bing account {{ item.1 }} but no site names it. Drop the
      account from the project, or let a site use it.
    quiet: true
  loop: "{{ indexing_plans | subelements('bing_accounts') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

# ⚠️ A key per declared engine, never an engine per present key: an empty lookup
# would otherwise read as a decision not to offer, and the night would be green.
# Bing's own key is the exception only where no site is offered to it under the
# project's key: every Bing site in an account, nothing left that would use it.
# The short keys also go into an EnvironmentFile=, whose own quoting rules would
# quietly mangle anything outside this alphabet. The only task that reads keys
# in a loop, hence no_log; the project and engine are in fail_msg.
- name: Assert every declared engine has its key
  ansible.builtin.assert:
    that:
      - item.1 == 'google' or indexing_short_key is match('^[A-Za-z0-9._~+/=-]+\Z')
        or (item.1 == 'bing' and indexing_short_key == '' and not indexing_default_bing_site)
      - item.1 != 'google' or indexing_projects[item.0.name].google_service_account | default('') | length > 0
    fail_msg: >-
      {{ item.0.name }} declares {{ item.1 }} but {{ indexing_key_fields[item.1] }}
      is empty or holds characters an environment file cannot carry.
    quiet: true
  vars:
    indexing_short_key: "{{ indexing_projects[item.0.name][indexing_key_fields[item.1]] | default('') | string }}"
    # Whether some site is offered to Bing under the project's own key, not an account's.
    indexing_default_bing_site: >-
      {%- set found = [] -%}
      {%- for site in item.0.sites -%}
      {%- if 'bing' in site.engines | default(item.0.engines) and site.bing_account is not defined -%}
      {%- set _ = found.append(site.domain) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ found | length > 0 }}
  loop: "{{ indexing_plans | subelements('engines') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  no_log: true

- name: Assert every Bing account's key can ride in an environment file
  ansible.builtin.assert:
    that:
      # The value as the inventory gave it: a null, a boolean or a number turned into text would read
      # as 'None', 'True' or '7' and pass as a key.
      - indexing_account_key is string
      - indexing_account_key is match('^[A-Za-z0-9._~+/=-]+\Z')
    fail_msg: >-
      {{ item.0.name }}: the key of Bing account {{ item.1 }} is not a string, is empty or holds
      characters an environment file cannot carry.
    quiet: true
  vars:
    indexing_account_key: "{{ indexing_projects[item.0.name].bing_accounts[item.1] }}"
  loop: "{{ indexing_plans | subelements('bing_accounts') }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  no_log: true

# ⚠️ One key, one project. Google's 200 a day belong to the service account's
# Cloud project and Bing's allowance and throttle to its key: two projects on
# one would spend one allowance twice and throttle each other, while each unit
# looked like its own.
- name: Assert no two projects share a key
  ansible.builtin.assert:
    that:
      - indexing_shared | length == indexing_shared | unique | length
    fail_msg: >-
      Two projects on this machine, or two Bing accounts, share a Google service account, a
      Bing key or a Yandex token. Each needs its own: the allowance belongs to the key.
    quiet: true
  vars:
    indexing_shared: >-
      {%- set seen = [] -%}
      {%- for project, spec in indexing_projects.items() -%}
      {%- for engine in spec.engines | default([]) if engine in ['google', 'bing', 'yandex'] -%}
      {%- set key = spec.get(indexing_key_fields[engine], '') -%}
      {%- if engine == 'google' -%}
      {%- set key = ((key | from_json) if key is string else key).client_email | default('') -%}
      {%- endif -%}
      {%- if (key | string | trim) | length > 0 -%}
      {%- set _ = seen.append(engine ~ ':' ~ (key | string | trim)) -%}
      {%- endif -%}
      {%- endfor -%}
      {#- A Bing account's key is its allowance, as the project's own is: two accounts, or an account
          and a project, on one key would spend one allowance twice. -#}
      {%- for account, key in (spec.bing_accounts | default({})).items() -%}
      {%- set _ = seen.append('bing:' ~ (key | string | trim)) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ seen }}
  no_log: true

- name: Offer each project's pages
  when: indexing_plans | length > 0
  vars:
    indexing_timer_names_on_disk: >-
      {{ indexing_timers_on_disk.files | map(attribute='path') | map('basename') | list }}
  block:
    # First, and before any check: the checks below ask the cluster through
    # psycopg2. Packages are the one change a refused run may leave.
    - name: Install what the program needs
      ansible.builtin.apt:
        name:
          - python3
          # The JWT Google's token is exchanged for is signed with this.
          - python3-cryptography
          # The program's way into the project's database.
          - python3-psycopg2
          # The schema is applied as the program's account, and Ansible hands a
          # module to an unprivileged account by ACL (see the umami role).
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Every project is checked before any is changed: a typo in the second
    # project's reader must not leave the first half-provisioned.
    - name: Check each project against the cluster
      ansible.builtin.include_tasks: preflight.yml
      loop: "{{ indexing_plans }}"
      loop_control:
        loop_var: indexing_plan
        label: "{{ indexing_plan.name }}"

    - name: Create the program's account
      ansible.builtin.user:
        name: "{{ indexing_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        home: /nonexistent

    # Every attribute named, not LOGIN alone: the module leaves unnamed ones as
    # they are, and a role of this name that already existed with more would
    # hand it to every night on the machine.
    - name: Create the program's Postgres role
      community.postgresql.postgresql_user:
        login_db: postgres
        name: "{{ indexing_user }}"
        role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,NOBYPASSRLS
      become: true
      become_user: postgres

    # Under --check the role above is not created, and a grant to it would be
    # refused rather than rehearsed. Asked, not inferred from `changed`: that is
    # also an existing role whose attributes differ, whose grants --check can show.
    - name: Read whether the program's Postgres role exists
      community.postgresql.postgresql_query:
        login_db: postgres
        query: SELECT count(*) > 0 AS present FROM pg_roles WHERE rolname = %(name)s
        named_args:
          name: "{{ indexing_user }}"
      become: true
      become_user: postgres
      check_mode: false
      changed_when: false
      register: indexing_pg_role

    - name: Create the program directory
      ansible.builtin.file:
        path: "{{ indexing_program_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ⚠️ local_follow: krot_index/google_jwt.py is a link into plugins/module_utils,
    # shared with the modules. Copied as a link it would point at nothing here.
    - name: Install the program
      ansible.builtin.copy:
        src: krot_index
        dest: "{{ indexing_program_dir }}/"
        local_follow: true
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    # The only way to know the copy is whole: a module that did not arrive, or a
    # package that is missing, would otherwise show at 01:00 as a traceback.
    - name: Check the program imports whole on this machine
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import psycopg2;
            from krot_index import cli, counts, google_jwt;
            from krot_index.engines import google, bing, yandex, indexnow;
            assert google_jwt.HAS_CRYPTOGRAPHY, google_jwt.CRYPTOGRAPHY_ERROR
      environment:
        PYTHONPATH: "{{ indexing_program_dir }}"
      changed_when: false

    - name: Install the schema file
      ansible.builtin.copy:
        src: schema.sql
        dest: "{{ indexing_program_dir }}/schema.sql"
        owner: root
        group: root
        mode: "0644"

    - name: Create the config directory
      ansible.builtin.file:
        path: "{{ indexing_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Prepare each project's database and files
      ansible.builtin.include_tasks: project.yml
      loop: "{{ indexing_plans }}"
      loop_control:
        loop_var: indexing_plan
        label: "{{ indexing_plan.name }}"

    - name: Install the services
      ansible.builtin.template:
        src: index.service.j2
        dest: "/etc/systemd/system/krot-index-{{ item.0.name }}-{{ item.1 }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ indexing_plans | subelements('jobs') }}"
      loop_control:
        label: "{{ item.0.name }} {{ item.1 }}"
      notify: Reload systemd

    # Before the timers are written: --check writes none, and systemd cannot find
    # a unit that is not on disk. One that is, drifted or not, is still asked.
    - name: Find the timers already on disk
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "krot-index-*.timer"
      register: indexing_timers_on_disk

    - name: Install the timers
      ansible.builtin.template:
        src: index.timer.j2
        dest: "/etc/systemd/system/krot-index-{{ item.0.name }}-{{ item.1 }}.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ indexing_plans | subelements('jobs') }}"
      loop_control:
        label: "{{ item.0.name }} {{ item.1 }}"
      notify: Reload systemd
      register: indexing_timers

    - name: Apply pending unit changes
      ansible.builtin.meta: flush_handlers

    - name: Enable the timers
      ansible.builtin.systemd_service:
        name: "{{ item }}.timer"
        state: started
        enabled: true
      loop: "{{ indexing_units }}"
      when: not ansible_check_mode or item ~ '.timer' in indexing_timer_names_on_disk

    # A reload alone leaves a running timer on the hour it was started with:
    # a schedule moved in the inventory would keep firing at the old one.
    - name: Restart the timers whose schedule changed
      ansible.builtin.systemd_service:
        name: "{{ indexing_changed_timer }}"
        state: restarted
      loop: "{{ indexing_timers.results | selectattr('changed') | list }}"
      loop_control:
        label: "{{ item.item.0.name }} {{ item.item.1 }}"
      vars:
        indexing_changed_timer: "krot-index-{{ item.item.0.name }}-{{ item.item.1 }}.timer"
      when: not ansible_check_mode or indexing_changed_timer in indexing_timer_names_on_disk

- name: Find previously installed timers
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "krot-index-*.timer"
  register: indexing_installed_timers

# An engine dropped from a project of THIS run, or a project named in
# indexing_retired_projects, has to stop offering. Nothing else: every project
# applies this role from its own inventory, so a unit of a project this run
# does not know belongs to another project's run. Only units carrying this
# role's marker go even then: a project's own krot-index-<engine> from the cron role
# share the prefix and stay until that project retires them itself.
- name: Retire timers no longer declared
  ansible.builtin.include_tasks: retire.yml
  loop: "{{ indexing_installed_timers.files | map(attribute='path') | map('basename') | list }}"
  loop_control:
    loop_var: indexing_timer_file
    label: "{{ indexing_timer_file }}"
  vars:
    # '' for a name that is not krot-index-<project>-<engine>, such as a project's own.
    indexing_timer_project: >-
      {{ indexing_timer_file | regex_replace('^krot-index-([a-z0-9]+)-[a-z]+\.timer$', '\1')
         if indexing_timer_file is match('^krot-index-[a-z0-9]+-[a-z]+\.timer$') else '' }}
  when:
    - indexing_timer_file | regex_replace('\\.timer$', '') not in indexing_units
    - indexing_timer_project in indexing_projects or indexing_timer_project in indexing_retired_projects

# Keys of a retired project must not stay on the machine; a project merely
# absent from this run may be another project's, and its keys are its own.
# Only the three names this role writes are touched. The schema and its rows
# stay in the project's database: they are its history, not ours.
- name: Find the files this role writes
  ansible.builtin.find:
    paths: "{{ indexing_config_dir }}"
    patterns: '^[a-z0-9]+\.(json|env|google\.json)$'
    use_regex: true
  register: indexing_config_files

- name: Remove the files of retired projects
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ indexing_config_files.files | map(attribute='path') | list }}"
  when: (item | basename).split('.')[0] in indexing_retired_projects
