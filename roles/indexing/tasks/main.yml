---
# Everything the inventory can get wrong is refused here, before the machine is
# touched: a unit installed over a malformed entry is a night that fails at
# 01:00, or worse, one that runs green over nothing.
- name: Assert each project is usable
  ansible.builtin.assert:
    that:
      - item.key is match('^[a-z0-9]+$')
      - item.value.database | default('') | length > 0
      - item.value.reader | default('') | length > 0
      - item.value.engines | default([]) | length > 0
      - item.value.engines | default([]) | difference(indexing_engines) | length == 0
      - item.value.engines | default([]) | unique | length == item.value.engines | default([]) | length
      - item.value.sites | default([]) | length > 0
    fail_msg: >-
      Project {{ item.key }} needs a name of [a-z0-9]+ (it is read back out of
      krot-index-<project>-<engine>, so no dash), a database, a reader, a list of
      engines out of {{ indexing_engines | join(', ') }} and at least one site.
    quiet: true
  loop: "{{ indexing_projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Assert each site names a domain and a sitemap
  ansible.builtin.assert:
    that:
      - item.1.domain | default('') | length > 0
      - item.1.sitemap_url | default('') is match('^https?://')
    fail_msg: "A site of {{ item.0.key }} needs a domain and an http(s) sitemap_url."
    quiet: true
  loop: "{{ indexing_projects | dict2items | subelements('value.sites') }}"
  loop_control:
    label: "{{ item.0.key }} {{ item.1.domain | default('<unnamed>') }}"

# ⚠️ A key per declared engine, never an engine per present key: an empty lookup
# would otherwise read as a decision not to offer, and the night would be green.
# The short keys also go into an EnvironmentFile=, whose own quoting rules would
# quietly mangle anything outside this alphabet.
- name: Assert every declared engine has its key
  ansible.builtin.assert:
    that:
      - item.1 == 'google' or indexing_short_key is match('^[A-Za-z0-9._~+/=-]+$')
      - item.1 != 'google' or (item.0.value.google_service_account | default('') | length > 0)
    fail_msg: >-
      {{ item.0.key }} declares {{ item.1 }} but {{ indexing_key_fields[item.1] }}
      is empty or holds characters an environment file cannot carry.
    quiet: true
  vars:
    indexing_short_key: "{{ item.0.value[indexing_key_fields[item.1]] | default('') | string }}"
  loop: "{{ indexing_projects | dict2items | subelements('value.engines') }}"
  loop_control:
    label: "{{ item.0.key }} {{ item.1 }}"
  no_log: true

# ⚠️ One key, one project. Google's 200 a day belong to the service account's
# Cloud project and Bing's allowance and throttle to its key: two projects on
# one would spend one allowance twice and throttle each other, while each unit
# looked like its own.
- name: Assert no two projects share a key
  ansible.builtin.assert:
    that:
      - indexing_shared | length == indexing_shared | unique | length
    fail_msg: >-
      Two projects on this machine share a Google service account, a Bing key or a
      Yandex token. Each project needs its own: the allowance belongs to the key.
    quiet: true
  vars:
    indexing_shared: >-
      {%- set seen = [] -%}
      {%- for project, spec in indexing_projects.items() -%}
      {%- for engine in spec.engines | default([]) if engine in ['google', 'bing', 'yandex'] -%}
      {%- set key = spec[indexing_key_fields[engine]] -%}
      {%- if engine == 'google' -%}
      {%- set key = ((key | from_json) if key is string else key).client_email | default('') -%}
      {%- endif -%}
      {%- set _ = seen.append(engine ~ ':' ~ key) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ seen }}
  no_log: true

- name: Offer each project's pages
  when: indexing_projects | length > 0
  block:
    - name: Install what the program needs
      ansible.builtin.apt:
        name:
          - python3
          # The JWT Google's token is exchanged for is signed with this.
          - python3-cryptography
          # The program's way into the project's database.
          - python3-psycopg2
          # The schema is applied as the program's account, and Ansible hands a
          # module to an unprivileged account by ACL (see the umami role).
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the program's account
      ansible.builtin.user:
        name: "{{ indexing_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        home: /nonexistent

    # Checked, not assumed: peer is what maps this account to its Postgres role
    # without a password, and a cluster that asks for one here would fail every
    # night with a message about authentication.
    - name: Read how the cluster lets this account in
      community.postgresql.postgresql_query:
        login_db: postgres
        query: >-
          SELECT auth_method FROM pg_hba_file_rules
          WHERE type = 'local'
            AND (database @> ARRAY['all'] OR database @> ARRAY[%(database)s])
            AND (user_name @> ARRAY['all'] OR user_name @> ARRAY[%(user)s])
          ORDER BY line_number LIMIT 1
        named_args:
          database: "{{ item.value.database }}"
          user: "{{ indexing_user }}"
      become: true
      become_user: postgres
      check_mode: false
      changed_when: false
      register: indexing_hba
      loop: "{{ indexing_projects | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert the account gets in by peer
      ansible.builtin.assert:
        that:
          - item.query_result | length == 1
          - item.query_result[0].auth_method == 'peer'
        fail_msg: >-
          pg_hba.conf does not let {{ indexing_user }} into {{ item.item.value.database }}
          over the local socket by peer. The program has no password to offer.
        quiet: true
      loop: "{{ indexing_hba.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Create the program's Postgres role
      community.postgresql.postgresql_user:
        login_db: postgres
        name: "{{ indexing_user }}"
        role_attr_flags: LOGIN
      become: true
      become_user: postgres

    - name: Create the program directory
      ansible.builtin.file:
        path: "{{ indexing_program_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ⚠️ local_follow: krot_index/google_jwt.py is a link into plugins/module_utils,
    # shared with the modules. Copied as a link it would point at nothing here.
    - name: Install the program
      ansible.builtin.copy:
        src: krot_index
        dest: "{{ indexing_program_dir }}/"
        local_follow: true
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    # The only way to know the copy is whole: a module that did not arrive, or a
    # package that is missing, would otherwise show at 01:00 as a traceback.
    - name: Check the program imports whole on this machine
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import psycopg2;
            from krot_index import cli, google_jwt;
            from krot_index.engines import google, bing, yandex, indexnow;
            assert google_jwt.HAS_CRYPTOGRAPHY, google_jwt.CRYPTOGRAPHY_ERROR
      environment:
        PYTHONPATH: "{{ indexing_program_dir }}"
      changed_when: false

    - name: Install the schema file
      ansible.builtin.copy:
        src: schema.sql
        dest: "{{ indexing_program_dir }}/schema.sql"
        owner: root
        group: root
        mode: "0644"

    - name: Prepare each project's database
      ansible.builtin.include_tasks: project.yml
      loop: "{{ indexing_projects | dict2items }}"
      loop_control:
        loop_var: indexing_project
        label: "{{ indexing_project.key }}"

    - name: Install the services
      ansible.builtin.template:
        src: index.service.j2
        dest: "/etc/systemd/system/krot-index-{{ item.0.key }}-{{ item.1 }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ indexing_projects | dict2items | subelements('value.engines') }}"
      loop_control:
        label: "{{ item.0.key }} {{ item.1 }}"
      notify: Reload systemd

    - name: Install the timers
      ansible.builtin.template:
        src: index.timer.j2
        dest: "/etc/systemd/system/krot-index-{{ item.0.key }}-{{ item.1 }}.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ indexing_projects | dict2items | subelements('value.engines') }}"
      loop_control:
        label: "{{ item.0.key }} {{ item.1 }}"
      notify: Reload systemd

    - name: Apply pending unit changes
      ansible.builtin.meta: flush_handlers

    - name: Enable the timers
      ansible.builtin.systemd_service:
        name: "{{ item }}.timer"
        state: started
        enabled: true
      loop: "{{ indexing_units }}"

- name: Find previously installed timers
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "krot-index-*.timer"
  register: indexing_installed_timers

# A project or engine dropped from the inventory has to stop offering. Only
# units carrying this role's marker go: busel's krot-index-<engine> from the
# cron role share the prefix and stay until busel retires them itself.
- name: Retire timers no longer declared
  ansible.builtin.include_tasks: retire.yml
  loop: "{{ indexing_installed_timers.files | map(attribute='path') | map('basename') | list }}"
  loop_control:
    loop_var: indexing_timer_file
    label: "{{ indexing_timer_file }}"
  when: indexing_timer_file | regex_replace('\\.timer$', '') not in indexing_units

# Keys of a project no longer declared must not stay on the machine. The schema
# and its rows stay in the project's database: they are its history, not ours.
- name: Find the files of every project
  ansible.builtin.find:
    paths: "{{ indexing_config_dir }}"
    patterns: "*"
  register: indexing_config_files

- name: Remove the files of projects no longer declared
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ indexing_config_files.files | map(attribute='path') | list }}"
  when: (item | basename).split('.')[0] not in indexing_projects
