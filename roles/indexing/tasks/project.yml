---
# One project, already checked by preflight.yml: its database gets the
# krot_index schema, its keys and config land in files the unit reads.
- name: Let the program and the application connect to the database
  community.postgresql.postgresql_privs:
    login_db: postgres
    type: database
    objs: "{{ indexing_plan.database }}"
    privs: CONNECT
    # The reader too: a database with PUBLIC's CONNECT revoked — ordinary
    # hardening — would take every grant below and still keep the screens out.
    roles: "{{ indexing_user }},{{ indexing_plan.reader }}"
  become: true
  become_user: postgres
  # --check on a machine the role has not been on: see main.yml.
  when: not ansible_check_mode or indexing_pg_role.query_result[0].present

# Asked here and not taken from preflight.yml, whose register a later project
# of the same run has overwritten by now.
- name: Look for the schema as a run before 7.0.0 left it
  community.postgresql.postgresql_query:
    login_db: "{{ indexing_plan.database }}"
    query: >-
      SELECT EXISTS (SELECT 1 FROM pg_namespace
                     WHERE nspname = %(legacy)s AND pg_get_userbyid(nspowner) = %(user)s)
         AND to_regnamespace(%(schema)s) IS NULL AS due
    named_args:
      legacy: "{{ indexing_legacy_schema }}"
      schema: "{{ indexing_schema }}"
      user: "{{ indexing_user }}"
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: indexing_legacy

# Renamed rather than created anew and copied: the rows, the application's grants
# and the default privileges on later tables all hang on the schema, not on its
# name, and move with it. Identifiers cannot be bound, hence the names from vars.
- name: Rename the program's schema from its name before 7.0.0
  community.postgresql.postgresql_query:
    login_db: "{{ indexing_plan.database }}"
    query: ALTER SCHEMA {{ indexing_legacy_schema }} RENAME TO {{ indexing_schema }}
  become: true
  become_user: postgres
  changed_when: true
  when: not ansible_check_mode and indexing_legacy.query_result[0].due

# Owned by the program's role, so the tables schema.sql makes are its own and it
# can write them. The application only reads — below. preflight.yml refused a
# krot_index schema owned by anybody else, so this only ever creates.
- name: Create the krot_index schema in the project's database
  community.postgresql.postgresql_schema:
    login_db: "{{ indexing_plan.database }}"
    name: "{{ indexing_schema }}"
    owner: "{{ indexing_user }}"
  become: true
  become_user: postgres

# The same for the schema: under --check it is not created, and a grant on it
# would be refused. Asked apart from the version table below, since a schema a
# failed run left without one still has grants --check can show.
- name: Read whether the krot_index schema exists
  community.postgresql.postgresql_query:
    login_db: "{{ indexing_plan.database }}"
    query: SELECT to_regnamespace(%(schema)s) IS NOT NULL AS present
    named_args:
      schema: "{{ indexing_schema }}"
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: indexing_schema_exists

- name: Read whether the schema has its version table
  community.postgresql.postgresql_query:
    login_db: "{{ indexing_plan.database }}"
    query: SELECT to_regclass('krot_index.schema_version') IS NOT NULL AS present
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: indexing_schema_present

- name: Read the version it is at
  community.postgresql.postgresql_query:
    login_db: "{{ indexing_plan.database }}"
    query: SELECT coalesce(max(version), 0) AS version FROM krot_index.schema_version
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: indexing_schema_at
  when: indexing_schema_present.query_result[0].present

# Only when the version differs, so a second pass changes nothing. As the
# program's account over peer, so every table is owned by the role that writes
# it. ON_ERROR_STOP: without it psql prints ERROR and exits 0.
- name: Apply the schema
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -q
      - -v
      - ON_ERROR_STOP=1
      - -d
      - "{{ indexing_plan.database }}"
      - -f
      - "{{ indexing_program_dir }}/schema.sql"
  become: true
  become_user: "{{ indexing_user }}"
  changed_when: true
  # Never under --check: a command is skipped there anyway, but becoming the
  # program's account comes first, and on a machine it is not on yet that fails.
  when: >-
    not ansible_check_mode
    and (not indexing_schema_present.query_result[0].present
         or indexing_schema_at.query_result[0].version != indexing_schema_version)

- name: Let the application into the schema
  community.postgresql.postgresql_privs:
    login_db: "{{ indexing_plan.database }}"
    type: schema
    objs: "{{ indexing_schema }}"
    privs: USAGE
    roles: "{{ indexing_plan.reader }}"
  become: true
  become_user: postgres
  when: not ansible_check_mode or indexing_schema_exists.query_result[0].present

- name: Let the application read the tables there now
  community.postgresql.postgresql_privs:
    login_db: "{{ indexing_plan.database }}"
    type: table
    schema: "{{ indexing_schema }}"
    objs: ALL_IN_SCHEMA
    privs: SELECT
    roles: "{{ indexing_plan.reader }}"
  become: true
  become_user: postgres
  when: not ansible_check_mode or indexing_schema_exists.query_result[0].present

# ⚠️ And the tables a later schema adds: without this, a table from version 2
# would be closed to the project's screens until somebody granted it by hand.
- name: Let the application read the tables added later
  community.postgresql.postgresql_privs:
    login_db: "{{ indexing_plan.database }}"
    type: default_privs
    target_roles: "{{ indexing_user }}"
    schema: "{{ indexing_schema }}"
    objs: TABLES
    privs: SELECT
    roles: "{{ indexing_plan.reader }}"
  become: true
  become_user: postgres
  when: not ansible_check_mode or indexing_schema_exists.query_result[0].present

# No key in it, so readable by anybody on the machine: which sites, which
# database. The keys are in the files below, readable only by the program.
- name: Write the project's config
  ansible.builtin.copy:
    content: >-
      {{ {'project': indexing_plan.name,
          'database': indexing_plan.database,
          'engines': indexing_plan.engines,
          'sites': indexing_plan.sites} | to_nice_json }}
    dest: "{{ indexing_config_dir }}/{{ indexing_plan.name }}.json"
    owner: root
    group: root
    mode: "0644"

# ⚠️ A file of its own, and the env file names only its path: the service
# account is multi-line JSON full of quotes and \n, and EnvironmentFile= would
# parse it by its own rules into a key that no longer signs.
- name: Write the project's Google key
  ansible.builtin.copy:
    content: >-
      {{ indexing_google if indexing_google is string else indexing_google | to_json }}
    dest: "{{ indexing_config_dir }}/{{ indexing_plan.name }}.google.json"
    owner: "{{ indexing_user }}"
    group: "{{ indexing_user }}"
    mode: "0600"
  vars:
    indexing_google: "{{ indexing_projects[indexing_plan.name].google_service_account }}"
  no_log: true
  when: "'google' in indexing_plan.engines"

- name: Drop a Google key no longer used
  ansible.builtin.file:
    path: "{{ indexing_config_dir }}/{{ indexing_plan.name }}.google.json"
    state: absent
  when: "'google' not in indexing_plan.engines"

- name: Write the project's keys
  ansible.builtin.template:
    src: project.env.j2
    dest: "{{ indexing_config_dir }}/{{ indexing_plan.name }}.env"
    owner: "{{ indexing_user }}"
    group: "{{ indexing_user }}"
    mode: "0600"
  no_log: true
