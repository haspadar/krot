---
# Yandex Webmaster: the host is added first, since the verification token is
# minted per host; the TXT is the whole "yandex-verification: <uin>" line.

- name: Add the site to Yandex and learn its proof
  haspadar.krot.yandex_site:
    domain: "{{ site_domain }}"
    wait_attempts: "{{ site_search_wait_attempts }}"
    wait_delay: "{{ site_search_wait_delay }}"
    oauth_token: "{{ site_yandex_token }}"
    api_url: "{{ site_yandex_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: site_search_yandex

- name: Put Yandex's proof into the zone
  haspadar.krot.cloudflare_record:
    zone_id: "{{ site_dns_zone_found.zone_id }}"
    type: "{{ site_search_yandex.verification_record.type }}"
    name: "{{ site_search_yandex.verification_record.name }}"
    content: "{{ site_search_yandex.verification_record.content }}"
    api_token: "{{ site_cloudflare_token }}"
    api_url: "{{ site_cloudflare_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when: site_search_yandex.verification_record is defined

- name: Verify with Yandex and hand over the sitemap
  haspadar.krot.yandex_site:
    domain: "{{ site_domain }}"
    verify: true
    sitemap_url: "{{ site_public_url }}{{ site_sitemap_path }}"
    wait_attempts: "{{ site_search_wait_attempts }}"
    wait_delay: "{{ site_search_wait_delay }}"
    oauth_token: "{{ site_yandex_token }}"
    api_url: "{{ site_yandex_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
