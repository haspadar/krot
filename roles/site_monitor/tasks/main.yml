---
# One monitor per site. With a keyword it is "<domain> (Profile)": it fails whenever a
# plain HTTP monitor on the same page would (5xx, a dead server, a dead database leave the
# word off the page) and also when the site answers 200 with nothing left on it. Without a
# keyword it is a plain HTTP monitor named "<domain>".
#
# A second monitor on the same page bought nothing and the free plan counts monitors: two
# per site ended it at the twenty-fifth site.
#
# The word is looked for on the watched page before the monitor is made, by the
# module itself: a keyword that is not there would alert from the first check,
# and the monitor's type cannot be changed later without making it anew.

- name: Skip when the site is not watched
  ansible.builtin.meta: end_role
  when: not (site_monitor.enabled | default(false))

- name: Watch the site answer
  haspadar.krot.uptimerobot_monitor:
    url: "{{ site_public_url }}/"
    friendly_name: "{{ site_domain }}"
    type: http
    api_key: "{{ site_uptimerobot_key }}"
    api_url: "{{ site_uptimerobot_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when: site_monitor.keyword | default('') | length == 0

- name: Watch the site keep its word
  haspadar.krot.uptimerobot_monitor:
    # A dict given in the inventory replaces the default whole, hence the default here.
    url: "{{ site_public_url }}{{ site_monitor.path | default('/') }}"
    friendly_name: "{{ site_domain }} (Profile)"
    type: keyword
    keyword: "{{ site_monitor.keyword }}"
    api_key: "{{ site_uptimerobot_key }}"
    api_url: "{{ site_uptimerobot_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when: site_monitor.keyword | default('') | length > 0
