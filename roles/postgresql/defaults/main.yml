---
postgresql_version: "18"

# Raising postgresql_version installs a new cluster beside the old one; it does
# not upgrade it, because PostgreSQL cannot read the previous major version's
# data directory. Off by default so that a version bump fails loudly instead of
# destroying databases: turn it on only once the data is migrated or known to be
# expendable.
postgresql_remove_other_versions: false

# Server only: creating per-site databases and roles belongs to whatever
# provisions the sites, so this role never learns about them.
postgresql_listen_addresses: localhost
postgresql_port: 5432

postgresql_max_connections: 100
postgresql_shared_buffers: 256MB
postgresql_effective_cache_size: 768MB
postgresql_work_mem: 8MB
postgresql_maintenance_work_mem: 64MB

# csvlog gives a shipper parseable fields without regex-guessing; stderr stays on
# for anything logged before the collector starts.
postgresql_log_destination: csvlog
postgresql_log_min_duration_ms: 500
postgresql_log_line_prefix: "%m [%p] %q%u@%d "
postgresql_log_retention_days: 14

# Query statistics, on by default: the slow log only catches a statement that is
# slow *once*, and the query that actually needs the index is usually the fast
# one called a hundred thousand times a day. Only pg_stat_statements aggregates
# by normalised query text and shows that. The cost is a fixed slab of shared
# memory (roughly a few MB at max 5000) and a hash lookup per statement — small
# enough that a server role is better off measuring than guessing.
postgresql_stat_statements: true
# Distinct normalised statements tracked. Beyond this the least-executed entries
# are evicted, so the number is a memory-vs-history trade, not a limit on load.
postgresql_stat_statements_max: 5000
# `top` records the statements a client sends; `all` also records those nested
# inside functions and procedures, which multiplies entries for little gain here.
postgresql_stat_statements_track: top

# Libraries loaded into every backend at postmaster start. A list, not a string,
# because PostgreSQL has no append syntax for it: whichever assignment comes last
# wins outright. A future auto_explain or pg_cron therefore has to be added
# *here* rather than in a second config file that would silently drop this one's
# entry. pg_stat_statements is appended by the template when it is enabled, so it
# need not be repeated in this list.
postgresql_shared_preload_libraries: []
