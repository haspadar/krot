---
# The extension's settings are the one part of the config `postgres -C` cannot
# check (files/apply-settings.sh): its library is not loaded there, so a value the
# live server would refuse on reload passes, the reload keeps the old value, and
# the run reports success. The ranges are pg_stat_statements' own.
- name: Assert the query statistics settings
  ansible.builtin.assert:
    that:
      - postgresql_stat_statements_max | int == postgresql_stat_statements_max | float
      - postgresql_stat_statements_max | int >= 100
      - postgresql_stat_statements_max | int <= 1073741823
      - postgresql_stat_statements_track in ['none', 'top', 'all']
    fail_msg: >-
      postgresql_stat_statements_max must be a whole number from 100 and
      postgresql_stat_statements_track one of none, top, all; PostgreSQL would
      refuse "{{ postgresql_stat_statements_max }}" / "{{ postgresql_stat_statements_track }}"
      on reload and keep running the old value.
    quiet: true
  when: postgresql_stat_statements

# Ubuntu's own PostgreSQL trails the pgdg release, and the major version is
# pinned per host, so take packages from upstream.
- name: Add the PostgreSQL signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/pgdg.asc
    owner: root
    group: root
    mode: "0644"

# A hand-rolled pgdg.list from an earlier manual install points at a different
# keyring path; apt refuses to read both, so the legacy file goes before ours
# lands.
- name: Drop the legacy pgdg source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pgdg.list
    state: absent

- name: Add the PostgreSQL repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: /usr/share/keyrings/pgdg.asc
    state: present
  register: postgresql_repo

# postgresql-common carries pg_lsclusters and the postinst machinery, but no
# server. Installing it alone lets the guard below look at the host before the
# versioned package can create anything: apt's postinst would otherwise build a
# cluster for the new version, and the role would be refusing to do something it
# had already done.
- name: Install the PostgreSQL tooling
  ansible.builtin.apt:
    name:
      - postgresql-common
      # psycopg2 is what the community.postgresql modules use to connect; without
      # it any later per-database task fails on import.
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: "{{ postgresql_repo.changed | ternary(0, 3600) }}"

# A major upgrade is not a version bump: PostgreSQL 18 cannot read PostgreSQL
# 16's data directory, so raising postgresql_version installs a *second* cluster
# beside the old one. pg_createcluster assigns it the first port not already
# claimed by an existing cluster — 5433 — while this role's config claims 5432,
# so the new cluster fails to start and the application keeps talking to the old
# one, none of it obviously.
#
# The role refuses rather than guesses, because the only ways forward are
# pg_upgrade, a dump/restore, or discarding the old data — and discarding is not
# something a variable change should do silently. Set
# postgresql_remove_other_versions once the data is migrated or known to be
# expendable.
#
# pg_lsclusters, not the directories under /etc/postgresql: a package whose
# postinst could not create a cluster (because this role's port was already
# taken) still leaves config directories behind, so those directories answer
# "which versions are installed" rather than "which clusters exist".
- name: List the clusters that exist
  ansible.builtin.command: pg_lsclusters --no-header
  changed_when: false
  # Without this the task is skipped under --check, leaving the list empty — so
  # a dry run would report a clean upgrade over a cluster it never looked at,
  # which is the one run where the guard matters most.
  check_mode: false
  register: postgresql_clusters

- name: Refuse to run beside a cluster of another version
  ansible.builtin.assert:
    that: not postgresql_other_versions or postgresql_remove_other_versions
    fail_msg: >-
      PostgreSQL {{ postgresql_other_versions | join(', ') }} already has a
      cluster on this host, and the requested version is
      {{ postgresql_version }}. Two clusters cannot share port
      {{ postgresql_port }}, so the new one would fail to start while the
      application kept using the old one. Migrate the data (pg_upgrade or
      dump/restore), then set postgresql_remove_other_versions=true to drop the
      old cluster — doing so DESTROYS its databases.
    quiet: true

# Purge, not remove: leaving the old data directory behind occupies the disk
# with databases nothing can read, and reinstalling that version later would
# silently resurrect them.
- name: Remove clusters of other versions
  ansible.builtin.apt:
    name:
      - "postgresql-{{ item }}"
      # The client package is not pulled in by the server one, so purging only
      # the server leaves psql and pg_dump of the retired version on the host.
      - "postgresql-client-{{ item }}"
    state: absent
    purge: true
  loop: "{{ postgresql_other_versions }}"
  when: postgresql_remove_other_versions

# purge removes what the package owns, and this role's drop-in is not part of any
# package — so /etc/postgresql/<old>/main/conf.d/99-krot.conf survives it. Left
# behind, it silently reconfigures that version if it is ever reinstalled.
- name: Remove this role's config from other versions
  ansible.builtin.file:
    path: "/etc/postgresql/{{ item }}"
    state: absent
  loop: "{{ postgresql_other_versions }}"
  when: postgresql_remove_other_versions

# Only now, once the guard has passed and any retired version is gone. Its
# postinst is free to create the cluster on the port this role wants, because
# nothing else holds it any more.
- name: Install PostgreSQL {{ postgresql_version }}
  ansible.builtin.apt:
    name: "postgresql-{{ postgresql_version }}"
    state: present

# The postinst creates a cluster only when it finds the port free, and a run
# that removed an old cluster in the same play has already passed that point —
# so the new version can end up with no cluster at all. `creates` keeps this a
# fallback: on a clean host the package got there first and the task is skipped.
- name: Create the cluster if the package could not
  ansible.builtin.command:
    cmd: >-
      pg_createcluster {{ postgresql_version }} main
      --port {{ postgresql_port }} --start
    creates: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"

- name: Configure the server
  ansible.builtin.template:
    src: krot.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/99-krot.conf"
    owner: postgres
    group: postgres
    mode: "0640"
    # Kept until the server has accepted the new file; a refused one is put back.
    # The copy's name does not end in .conf, so conf.d never includes it.
    backup: true
  register: postgresql_conf

# Check mode only: a real run starts the server inside the block below, where a
# file it cannot start on is rolled back.
- name: Enable PostgreSQL
  ansible.builtin.service:
    name: "postgresql@{{ postgresql_version }}-main"
    state: started
    enabled: true
  when: ansible_check_mode

# Applying is decided by the server, not by whether this run changed the file: a
# run that stopped after writing it is finished by the next one. A reload applies
# everything it can without dropping a connection — on a machine serving its sites
# live a restart is a 5xx on all of them — and the server then names the
# postmaster-level settings (shared_buffers, max_connections,
# shared_preload_libraries, port) it accepted but can only apply by restart. See
# files/apply-settings.sh for why neither value comparison nor error messages can
# make that call.
- name: Apply the new settings
  when: not ansible_check_mode
  block:
    - name: Start PostgreSQL if it is down
      ansible.builtin.service:
        name: "postgresql@{{ postgresql_version }}-main"
        state: started
        enabled: true

    - name: Check, reload and ask the server what still needs a restart
      ansible.builtin.script:
        cmd: >-
          apply-settings.sh {{ postgresql_version }}
          /etc/postgresql/{{ postgresql_version }}/main/conf.d/99-krot.conf
      become: true
      become_user: postgres
      register: postgresql_applied
      changed_when: "'reloaded' in postgresql_applied.stdout_lines"

    - name: Restart PostgreSQL for the settings only a restart applies
      ansible.builtin.service:
        name: "postgresql@{{ postgresql_version }}-main"
        state: restarted
      when: "postgresql_applied.stdout_lines | select('match', '^restart: ') | list | length > 0"

    - name: Drop the copy of the previous file, the new one being in effect
      ansible.builtin.file:
        path: "{{ postgresql_conf.backup_file }}"
        state: absent
      when: postgresql_conf.backup_file is defined
  rescue:
    # Only two failures roll the file back: a value the check refused (exit 64,
    # the server untouched) and a start or restart that did not come up (the
    # server down). Anything else — psql unreachable, a reload that never landed —
    # fails as it is: the new file may be fine, and rolling it back would discard
    # it for an unrelated cause.
    - name: Name the failure
      ansible.builtin.set_fact:
        postgresql_refused: >-
          {{ ansible_failed_task.name is search('^Check, reload')
             and ansible_failed_result.rc | default(0) == 64 }}
        postgresql_start_failed: "{{ ansible_failed_task.name is search('^(Start|Restart) PostgreSQL') }}"
        postgresql_failure: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg, true) | trim }}"

    # Rolled back only when there is something to return to: the copy this run
    # made, or nothing at all for a file this run created. An unchanged file,
    # written by an earlier interrupted run, has neither and is left as it is.
    - name: Decide whether the file can be rolled back
      ansible.builtin.set_fact:
        postgresql_rolled_back: >-
          {{ (postgresql_refused or postgresql_start_failed)
             and (postgresql_conf.backup_file is defined or postgresql_conf.changed) }}

    # A refused value left on disk would wait for the next restart that does not
    # go through this role — a reboot, a package upgrade — and keep the server down.
    - name: Put back the file the server last accepted
      ansible.builtin.copy:
        src: "{{ postgresql_conf.backup_file }}"
        dest: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/99-krot.conf"
        remote_src: true
        owner: postgres
        group: postgres
        mode: "0640"
      when:
        - postgresql_rolled_back
        - postgresql_conf.backup_file is defined

    - name: Remove a file this run created and the server could not take
      ansible.builtin.file:
        path: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/99-krot.conf"
        state: absent
      when:
        - postgresql_rolled_back
        - postgresql_conf.backup_file is not defined

    - name: Start PostgreSQL again on the previous file
      ansible.builtin.service:
        name: "postgresql@{{ postgresql_version }}-main"
        state: started
      when:
        - postgresql_start_failed
        - postgresql_rolled_back

    # Dropped only after the previous file is back: a failed restore keeps it.
    # Reached only once a restore, if any, succeeded — a failed one stops the rescue
    # above and keeps the copy. Without a rollback the new file stays and the copy
    # has nothing left to do; left behind it would never be removed.
    - name: Drop the copy of the previous file
      ansible.builtin.file:
        path: "{{ postgresql_conf.backup_file }}"
        state: absent
      when: postgresql_conf.backup_file is defined

    - name: Fail the run, naming what happened
      ansible.builtin.fail:
        msg: >-
          {% if postgresql_refused %}PostgreSQL refused the new configuration; the server was
          not touched{% elif postgresql_start_failed %}PostgreSQL did not start with the new
          configuration{% else %}Applying the configuration failed{% endif %}{% if
          postgresql_rolled_back %}; the previous file is back on disk{% if
          postgresql_start_failed %} and the server was started on it{% endif %}{% elif
          postgresql_refused or postgresql_start_failed %}; this run did not write the file, so
          there was nothing to return to and it is still on disk{% else %}; nothing was rolled
          back{% endif %}: {{ postgresql_failure }}

# After the restart, not before: a restart that fails is rolled back above, and
# refusing first would skip that protection. The file is not rolled back — it is
# right; the override is what to remove (ALTER SYSTEM RESET <name>), and the next
# run reloads once postgresql.auto.conf changes.
- name: Refuse settings of this role that a later config source overrides
  ansible.builtin.fail:
    msg: >-
      These settings of 99-krot.conf are not in effect, a later source wins:
      {{ postgresql_overridden | first | regex_replace('^overridden: ', '') }}
  vars:
    postgresql_overridden: "{{ postgresql_applied.stdout_lines | select('match', '^overridden: ') | list }}"
  when:
    - not ansible_check_mode
    - postgresql_overridden | length > 0

# The extension can only be created once the library is actually in memory, which
# the restart above has already seen to.

# Into `postgres`, the cluster's own maintenance database. The view reports every
# database in the cluster no matter which one it is read from, so installing it
# here keeps the promise made in defaults/main.yml: this role provisions a server
# and never learns the names of the sites' databases.
- name: Collect query statistics
  community.postgresql.postgresql_ext:
    name: pg_stat_statements
    # login_db, not db: community.postgresql 5.0.0 dropped the `db` alias and
    # fails with "missing required arguments: login_db". The name works on 3.x
    # and 4.x too, so it does not narrow the supported range.
    login_db: postgres
    state: "{{ postgresql_stat_statements | ternary('present', 'absent') }}"
  become: true
  become_user: postgres
  # Reads and writes the catalogue directly; there is nothing for check mode to
  # predict without a live connection.
  check_mode: false
