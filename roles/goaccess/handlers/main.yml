---
- name: Restart the goaccess timer
  ansible.builtin.systemd_service:
    name: krot-goaccess.timer
    state: restarted
    daemon_reload: true

# Same order as the nginx role: test the assembled config before reloading. A
# reload on a broken file leaves nginx serving the old one, which hides the
# breakage until something restarts it — by which time the cause is forgotten.
- name: Verify nginx configuration for goaccess
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Reload nginx for goaccess

- name: Reload nginx for goaccess
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: Reload nginx for goaccess
