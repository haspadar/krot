---
# The sites actually reported on: what was configured, or — when nothing was —
# the domains that have an enabled vhost on this host. The vhost filename is the
# domain, which is also how the site's log file is named.
goaccess_effective_sites: >-
  {{ goaccess_sites if goaccess_sites else
     (goaccess_enabled_vhosts.files | default([]))
     | map(attribute='path') | map('basename')
     | map('regex_replace', '\.conf$', '')
     | map('community.general.dict_kv', 'domain')
     | list }}
