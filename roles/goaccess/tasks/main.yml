---
# This role builds the reports and stops there. Serving them is the project's
# job — busel puts them behind the sign-in its admin already has — because the
# alternative is a role that knows which host is an admin, which domain it
# answers on and how its sessions work, none of which is true of the next
# machine it runs on.
- name: Install GoAccess
  ansible.builtin.apt:
    name: goaccess
    state: present
    update_cache: true
    cache_valid_time: 3600

# An account of its own rather than root: this reads logs and writes HTML, and
# neither needs the machine. Membership in adm is what grants the 0640 nginx
# logs, so no permissions on them have to change.
- name: Create the reporting account
  ansible.builtin.user:
    name: "{{ goaccess_user }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
    groups: adm
    append: true

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(goaccess_user) }}"
    group: "{{ item.group | default(goaccess_user) }}"
    mode: "{{ item.mode }}"
  loop:
    # The account serving the reports reads them through this group; the world
    # does not get in, because the file list alone is the list of domains on
    # this machine.
    #
    # setgid: reports are written by an account that is not in that group, and
    # it cannot chgrp into one it does not belong to. The bit makes the kernel
    # assign the group instead, and .build/ inherits it in turn, so a report
    # carries the right group from creation rather than after a fix-up.
    - path: "{{ goaccess_report_dir }}"
      group: "{{ goaccess_reader_group }}"
      mode: "2750"
    - path: /var/log/goaccess
      mode: "0750"
    - path: /etc/goaccess
      owner: root
      group: root
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

# Created here rather than left to the builder, which runs as an account that is
# not in the reader group — and for such a user the kernel silently drops the
# setgid bit on chmod, so the builder can inherit the bit but never set it. This
# task runs as root, where that restriction does not apply, and it also fixes a
# directory left with the wrong mode by an earlier version.
- name: Create the humans report directory
  ansible.builtin.file:
    path: "{{ goaccess_report_dir }}/{{ goaccess_humans_subdir }}"
    state: directory
    owner: "{{ goaccess_user }}"
    group: "{{ goaccess_reader_group }}"
    mode: "2750"
  when: goaccess_humans_report

- name: Check the GeoIP database is there
  ansible.builtin.stat:
    path: "{{ goaccess_geoip_database }}"
  register: goaccess_geoip_stat
  check_mode: false
  when: goaccess_geoip_database | length > 0

# Naming a database that is not on disk makes GoAccess exit on startup, so every
# report on the machine would stop being rebuilt at once — and the ones already
# built would sit there looking current. Stopping here says which file is
# missing instead.
- name: Refuse to configure a GeoIP database that is missing
  ansible.builtin.assert:
    that: goaccess_geoip_stat.stat.exists
    fail_msg: >-
      goaccess_geoip_database points at {{ goaccess_geoip_database }}, which is
      not on this host. Run the geoip role first, or leave the variable empty to
      build the reports without a geolocation panel.
    quiet: true
  when: goaccess_geoip_database | length > 0

- name: Configure the parser
  ansible.builtin.template:
    src: goaccess.conf.j2
    dest: /etc/goaccess/krot-sites.conf
    owner: root
    group: root
    mode: "0644"

# Passed to the humans build with -b, never named in the parser config: the
# config is shared by both reports, and the full one counts crawlers on purpose.
- name: List the crawlers GoAccess does not know
  ansible.builtin.template:
    src: crawlers.j2
    dest: /etc/goaccess/krot-crawlers.list
    owner: root
    group: root
    mode: "0644"
  register: goaccess_crawler_list
  when: goaccess_humans_report

# When no sites are given, take them from the host: a domain is reported on if
# it has an enabled vhost. Naming them in inventory would move the site list into
# the machine's configuration, and this project deliberately keeps it out —
# the sites live in the project's own database, not in Ansible. It also skips
# the logs left behind by removed or test vhosts, which a glob over
# /var/log/nginx would happily pick up.
- name: Find the enabled sites
  ansible.builtin.find:
    paths: /etc/nginx/sites-enabled
    patterns: "*.conf"
    file_type: any
  register: goaccess_enabled_vhosts
  when: not goaccess_sites

- name: List the sites to report on
  ansible.builtin.template:
    src: sites.j2
    dest: /etc/goaccess/krot-sites.conf.sites
    owner: root
    group: root
    mode: "0644"
  register: goaccess_site_list

- name: Install the report builder
  ansible.builtin.copy:
    src: build-reports.sh
    dest: /usr/local/sbin/krot-goaccess-reports
    owner: root
    group: root
    mode: "0755"

- name: Install the timer units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: service.j2
      dest: krot-goaccess.service
    - src: timer.j2
      dest: krot-goaccess.timer
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart the goaccess timer

- name: Enable the timer
  ansible.builtin.systemd_service:
    name: krot-goaccess.timer
    enabled: true
    state: started
    daemon_reload: true

# Build once now rather than leaving the first report until the timer fires: a
# role that finishes with nothing to show cannot be told from one that failed.
#
# The builder is run directly rather than through the systemd module: `state:
# started` on a oneshot unit returns as soon as systemd accepts the job, so the
# play would move on to serving reports that do not exist yet. Running the script
# means this task finishes when the reports do, and a failure is this task's
# failure rather than a unit that quietly went inactive.
- name: Look for reports already built
  ansible.builtin.find:
    paths: "{{ goaccess_report_dir }}"
    patterns: "*.html"
  register: goaccess_existing_reports
  # A read that decides whether the build below runs; skipping it under --check
  # would report a build that is not going to happen.
  check_mode: false

# Counted separately from the full reports: on a machine upgraded from a version
# without them, the full ones are all present and the site list has not changed,
# so the build below would be skipped and the humans reports would not appear
# until the timer next fired — up to an hour of a feature that is on by default
# quietly not being there.
#
# Compared against the full reports rather than the site list, because the two
# are built as a pair and a site whose logs hold nothing deliberately gets
# neither. Measuring against the sites would count rozly.nl — listed, no traffic
# yet, no report by design — as missing, and rebuild on every single run
# forever.
- name: Look for humans reports already built
  ansible.builtin.find:
    paths: "{{ goaccess_report_dir }}/{{ goaccess_humans_subdir }}"
    patterns: "*.html"
  register: goaccess_existing_humans
  check_mode: false
  failed_when: false
  when: goaccess_humans_report

- name: Build the reports once
  ansible.builtin.command: /usr/local/sbin/krot-goaccess-reports
  become: true
  become_user: "{{ goaccess_user }}"
  environment:
    REPORT_DIR: "{{ goaccess_report_dir }}"
    BUILD_HUMANS: "{{ '1' if goaccess_humans_report else '0' }}"
    HUMANS_SUBDIR: "{{ goaccess_humans_subdir }}"
  changed_when: true
  # check_mode: false forces the command to run even under --check, which is
  # what the two reads above need; here it would make a dry run write actual
  # HTML. The `when` below keeps it out of check runs instead.
  check_mode: false
  # When there is nothing to serve yet, or when the site list just changed. A
  # removed vhost leaves its report served until something rebuilds, and waiting
  # for the timer would keep a retired domain readable for up to an hour.
  # Otherwise this stays out of the way: refreshing the numbers is the timer's
  # job, and rebuilding on every pass would report a change each time and drown
  # out the ones that mean something.
  when:
    - not ansible_check_mode
    - goaccess_effective_sites | length > 0
    - not goaccess_existing_reports.files
      or goaccess_site_list.changed
      or goaccess_crawler_list.changed | default(false)
      or (goaccess_humans_report
          and goaccess_existing_humans.files | default([]) | length
              < goaccess_existing_reports.files | length)

# The builder sets these on every report it writes, so a new machine never needs
# this. An existing one does: reports written by an earlier version keep their
# old mode until something rebuilds them, which is the timer, up to an hour
# away. For that hour the role would claim a permission the files do not have.
- name: Correct the mode of reports built earlier
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: "{{ goaccess_reader_group }}"
    mode: "0640"
  loop: "{{ goaccess_existing_reports.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# Turning the humans report off leaves its directory behind, and the pages in it
# stop being rebuilt while still being served — traffic frozen on the day the
# switch was flipped, next to a full report that keeps moving. Whoever reads
# them has no way to tell.
- name: Remove the humans reports when they are switched off
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ goaccess_report_dir }}/{{ goaccess_humans_subdir }}"
    # The crawler list goes with them. On its own it is harmless, but a list of
    # agents to filter, sitting next to no report that filters them, reads as a
    # feature that is on when it is not.
    - /etc/goaccess/krot-crawlers.list
  when: not goaccess_humans_report

# Earlier versions of this role served the reports themselves, on a loopback
# port behind a password, reached over an SSH tunnel. Removed: the reports are
# read through the project's admin now, and leaving a second way in would mean a
# second password to rotate and a port to remember. Machines provisioned by that
# version still have the vhost, and nginx would go on serving it.
- name: Remove the report vhost this role used to install
  ansible.builtin.file:
    path: /etc/nginx/conf.d/krot-goaccess.conf
    state: absent
  notify: Reload nginx for goaccess
