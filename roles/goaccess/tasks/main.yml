---
# The reports name every domain on the machine and how much traffic each one
# gets. Behind a tunnel that is fine; on a public interface it is the list the
# network exists to keep apart, and with auth off it is that list handed to
# anyone who finds the port. The address stays configurable — a host reached
# over a private network may legitimately want another one — but leaving the
# loopback has to be a deliberate act, not a typo in a variable.
- name: Refuse to publish the reports beyond loopback without a password
  ansible.builtin.assert:
    that: goaccess_listen_address.startswith('127.') or goaccess_auth_enabled
    fail_msg: >-
      goaccess_listen_address is {{ goaccess_listen_address }}, which is
      reachable from outside this machine, and goaccess_auth_enabled is off.
      That serves every domain on this host, and its traffic, to whoever finds
      the port. Keep the default 127.0.0.1 and use an SSH tunnel, or turn the
      password on.
    quiet: true

- name: Install GoAccess
  ansible.builtin.apt:
    name: goaccess
    state: present
    update_cache: true
    cache_valid_time: 3600

# An account of its own rather than root: this reads logs and writes HTML, and
# neither needs the machine. Membership in adm is what grants the 0640 nginx
# logs, so no permissions on them have to change.
- name: Create the reporting account
  ansible.builtin.user:
    name: "{{ goaccess_user }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
    groups: adm
    append: true

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(goaccess_user) }}"
    group: "{{ item.group | default(goaccess_user) }}"
    mode: "{{ item.mode }}"
  loop:
    # nginx reads the reports, so its group needs the directory; the world does
    # not, because the file list alone is the list of domains on this machine.
    - path: "{{ goaccess_report_dir }}"
      group: www-data
      mode: "0750"
    - path: /var/log/goaccess
      mode: "0750"
    - path: /etc/goaccess
      owner: root
      group: root
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

- name: Configure the parser
  ansible.builtin.template:
    src: goaccess.conf.j2
    dest: /etc/goaccess/krot-sites.conf
    owner: root
    group: root
    mode: "0644"

# When no sites are given, take them from the host: a domain is reported on if
# it has an enabled vhost. Naming them in inventory would move the site list into
# the machine's configuration, and this project deliberately keeps it out —
# the sites live in the project's own database, not in Ansible. It also skips
# the logs left behind by removed or test vhosts, which a glob over
# /var/log/nginx would happily pick up.
- name: Find the enabled sites
  ansible.builtin.find:
    paths: /etc/nginx/sites-enabled
    patterns: "*.conf"
    file_type: any
  register: goaccess_enabled_vhosts
  when: not goaccess_sites

- name: List the sites to report on
  ansible.builtin.template:
    src: sites.j2
    dest: /etc/goaccess/krot-sites.conf.sites
    owner: root
    group: root
    mode: "0644"
  register: goaccess_site_list

- name: Install the report builder
  ansible.builtin.copy:
    src: build-reports.sh
    dest: /usr/local/sbin/krot-goaccess-reports
    owner: root
    group: root
    mode: "0755"

- name: Install the timer units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: service.j2
      dest: krot-goaccess.service
    - src: timer.j2
      dest: krot-goaccess.timer
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart the goaccess timer

- name: Enable the timer
  ansible.builtin.systemd_service:
    name: krot-goaccess.timer
    enabled: true
    state: started
    daemon_reload: true

# Build once now rather than leaving the first report until the timer fires: a
# role that finishes with nothing to show cannot be told from one that failed.
#
# The builder is run directly rather than through the systemd module: `state:
# started` on a oneshot unit returns as soon as systemd accepts the job, so the
# play would move on to serving reports that do not exist yet. Running the script
# means this task finishes when the reports do, and a failure is this task's
# failure rather than a unit that quietly went inactive.
- name: Look for reports already built
  ansible.builtin.find:
    paths: "{{ goaccess_report_dir }}"
    patterns: "*.html"
  register: goaccess_existing_reports
  # A read that decides whether the build below runs; skipping it under --check
  # would report a build that is not going to happen.
  check_mode: false

- name: Build the reports once
  ansible.builtin.command: /usr/local/sbin/krot-goaccess-reports
  become: true
  become_user: "{{ goaccess_user }}"
  environment:
    REPORT_DIR: "{{ goaccess_report_dir }}"
  changed_when: true
  # check_mode: false forces the command to run even under --check, which is
  # what the two reads above need; here it would make a dry run write actual
  # HTML. The `when` below keeps it out of check runs instead.
  check_mode: false
  # When there is nothing to serve yet, or when the site list just changed. A
  # removed vhost leaves its report served until something rebuilds, and waiting
  # for the timer would keep a retired domain readable for up to an hour.
  # Otherwise this stays out of the way: refreshing the numbers is the timer's
  # job, and rebuilding on every pass would report a change each time and drown
  # out the ones that mean something.
  when:
    - not ansible_check_mode
    - goaccess_effective_sites | length > 0
    - not goaccess_existing_reports.files or goaccess_site_list.changed

- name: Read the auth snippet
  ansible.builtin.slurp:
    src: /etc/nginx/snippets/krot-auth.conf
  register: goaccess_auth_snippet
  failed_when: false
  # A read whose result decides whether the vhost is written at all.
  check_mode: false
  when: goaccess_auth_enabled

# An include naming a file that is not there is not a broken page — nginx calls
# it emerg and refuses the entire configuration, so every site on the machine
# goes down with it. Better to stop here, with the sites still up.
#
# The contents are checked, not just the path: an empty or edited snippet passes
# a existence test and leaves the reports served to anyone who reaches the port.
# The password file it names has to be there too, for the same emerg reason.
- name: Refuse to serve the reports without working authentication
  ansible.builtin.assert:
    that:
      - goaccess_auth_snippet.content is defined
      - "'auth_basic' in (goaccess_auth_snippet.content | b64decode)"
      - "'auth_basic_user_file' in (goaccess_auth_snippet.content | b64decode)"
    fail_msg: >-
      goaccess_auth_enabled is on but /etc/nginx/snippets/krot-auth.conf is
      missing or does not set auth_basic. Run the nginx role with
      nginx_auth_enabled first: without it the reports would be served to
      whoever reaches the port, and a missing include takes down every site on
      this host rather than just these pages.
    quiet: true
  when: goaccess_auth_enabled

- name: Check the password file the snippet names
  ansible.builtin.stat:
    path: "{{ (goaccess_auth_snippet.content | b64decode)
              | regex_search('auth_basic_user_file\\s+([^;]+);', '\\1') | first | trim }}"
  register: goaccess_auth_password_file
  check_mode: false
  when: goaccess_auth_enabled

- name: Refuse to serve the reports without the password file
  ansible.builtin.assert:
    that: goaccess_auth_password_file.stat.exists
    fail_msg: >-
      The auth snippet names a password file that does not exist. nginx treats
      that as emerg and refuses the whole configuration, so every site on this
      host would go down with the reports.
    quiet: true
  when: goaccess_auth_enabled

- name: Serve the reports
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/nginx/conf.d/krot-goaccess.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx for goaccess
