---
# Ubuntu 24.04 ships GoAccess 1.8.1; the project's own repository has 1.11.
# Worth the extra repository for what it fixes rather than for the number:
# parsing is about a third faster and uses about a fifth less memory, which is
# what a machine hosting thirty sites will care about, and the geolocation panel
# gained cities plus a corrected country-to-continent mapping.
#
# Turn off to stay on whatever the distribution provides — the role works with
# either, and the reports look the same apart from the city breakdown.
#
# Switching it off removes the repository but does not put the older version
# back: apt does not downgrade on its own, and a role that silently replaced a
# working binary with an older one would be doing something nobody asked for.
# Downgrading is `apt install goaccess=<version>` by hand.
goaccess_upstream_repository: true

# Which logs to report on. One report per entry, never a combined one: a single
# page listing every domain is exactly where the link between sites of a network
# becomes visible to whoever gets hold of it.
#
#   goaccess_sites:
#     - domain: example.com
#       log: /var/log/nginx/example.com-access.log
#
# `log` defaults to /var/log/nginx/<domain>-access.log when omitted.
goaccess_sites: []

# Where the generated reports land. This role writes them and stops; what reads
# them is the project — busel serves them through its admin. The directory is
# group-readable so that account can get in, and closed to everyone else,
# because the file names alone are the list of domains on this machine.
goaccess_report_dir: /var/www/goaccess

# The group allowed to read the reports. Whatever runs the page that serves
# them: on busel that is PHP-FPM, which shares www-data with nginx.
goaccess_reader_group: www-data

# The nginx log_format the reports are parsed with. The default matches the
# `recipient` format the sites generate:
#
#   [$time_local] $remote_addr - $host "$request" $status $body_bytes_sent
#   "$http_referer" "$http_user_agent" cf=$http_cf_ipcountry rt=$request_time
#
# %^ skips a field. The country code is skipped rather than mapped: GoAccess
# derives geography from its own database, and feeding it Cloudflare's header
# would need a column type it has no place for.
goaccess_log_format: >-
  [%d:%t %^] %h - %v "%r" %s %b "%R" "%u" cf=%^ rt=%T
goaccess_date_format: "%d/%b/%Y"
goaccess_time_format: "%H:%M:%S"

# How often the reports are rebuilt. A systemd timer, not cron: it keeps the
# schedule, the command and the failure handling in one unit the host already
# knows how to report on.
goaccess_interval: hourly

# The unprivileged account the reports are built as. It only needs to read
# /var/log/nginx (group adm) and write its own directories.
goaccess_user: goaccess

# A second report per site with crawlers filtered out, alongside the full one.
#
# Off by default, and the reason is that it never became trustworthy. Three
# passes were measured on berlindame.de: --ignore-crawlers alone left 41
# "visitors", the name list below brought it to 36, and requiring browser-like
# behaviour on top of that brought 103 addresses to 6. Of those six, three
# fetched /media/ with referers exactly as a browser does and cannot be told
# from people by the log at all. The honest count was two.
#
# A number that swings from 41 to 6 under filters that all look reasonable is
# not a measurement, and it is read as one — which is worse than having no
# figure. Distinguishing people from machines by request pattern alone has a
# ceiling, and this is it. Anything needing a real count wants a mark the
# browser executes, which the log cannot supply.
#
# The full report is unaffected and remains the point of the role: it counts
# everything and answers whether a site is being crawled at all.
#
# Turning this on restores the second report; the role then rebuilds it on the
# same run rather than waiting for the timer.
goaccess_humans_report: false

# Where those go, under goaccess_report_dir. A subdirectory rather than a
# <domain>-humans.html suffix so that anything listing reports by *.html still
# sees exactly one file per domain and needs no rule for telling the two apart.
goaccess_humans_subdir: humans

# Agents counted as crawlers in the humans report on top of the ones GoAccess
# knows. Unused while goaccess_humans_report is off, and kept for when it is
# turned on: the list is measured against real traffic and would only have to be
# rediscovered.
#
# --ignore-crawlers only catches those that say so — "bot", "crawler",
# "spider" in the user agent — and half the machines crawling a site do not.
# Measured on berlindame.de 2026-08-02: 41 "visitors" became 36, and the browser
# list went from naming GoogleOther and Dataprovider to nothing but Chrome,
# Safari, Firefox and Edge.
#
# The list applies to the humans report only. The full one keeps counting
# everything on purpose: it is what answers "is this site being crawled at all".
#
# A name matches as a substring of the user agent, and the type must be spelled
# exactly "Crawlers" — GoAccess treats anything else as a new browser category,
# which quietly *raises* the visitor count instead of lowering it. The file adds
# to /etc/goaccess/browsers.list rather than replacing it, so the agents GoAccess
# already knows stay filtered.
goaccess_extra_crawlers:
  # Google's fetcher for products other than Search. Carries no "bot".
  - GoogleOther
  # Commercial site scanners.
  - Dataprovider
  - Expanse
  - Censys
  # Research scanners (internet-measurement.com and friends).
  - InternetMeasurement
  # Our own uptime monitor: 462 of berlindame's 1240 requests, more than every
  # other agent put together, and none of them a reader.
  - UptimeRobot
  # HTTP libraries. On a dating site a request from one of these is not a
  # visitor; if something legitimate polls with curl, it is noise either way.
  - Go-http-client
  - okhttp
  - curl
  - Wget
  # A browser driven by a script, usually pretending to be a normal one.
  - HeadlessChrome

# The MaxMind database the reports map addresses through, giving them a
# geolocation panel. Empty means no panel: the role does not install the
# database — that is what the geoip role is for, and a machine may well want one
# without the other.
#
# The country comes from the address, not from Cloudflare's cf= header, which
# the log format deliberately skips: GoAccess has no field type to receive a
# ready-made country code, and the only way to feed it one would be to occupy a
# column that means something else.
#
# This assumes the log holds the visitor's address rather than Cloudflare's.
# Behind a CDN that is true only if real-IP is configured, which on busel the
# project's vhost generator does — without it the panel would map the CDN's own
# datacentres and look plausible while being wrong.
goaccess_geoip_database: ""

# GoAccess can serve a live report itself, over a websocket, rebuilding as
# requests arrive. Not used here: it means a daemon holding the logs open, a
# port to reach it on and a page whose cost is paid on every view. A timer
# writing a file costs one second an hour and leaves nothing listening.
