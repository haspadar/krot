---
# Which logs to report on. One report per entry, never a combined one: a single
# page listing every domain is exactly where the link between sites of a network
# becomes visible to whoever gets hold of it.
#
#   goaccess_sites:
#     - domain: example.com
#       log: /var/log/nginx/example.com-access.log
#
# `log` defaults to /var/log/nginx/<domain>-access.log when omitted.
goaccess_sites: []

# Where the generated reports land. Served by nginx, never world-readable.
goaccess_report_dir: /var/www/goaccess

# The nginx log_format the reports are parsed with. The default matches the
# `recipient` format the sites generate:
#
#   [$time_local] $remote_addr - $host "$request" $status $body_bytes_sent
#   "$http_referer" "$http_user_agent" cf=$http_cf_ipcountry rt=$request_time
#
# %^ skips a field. The country code is skipped rather than mapped: GoAccess
# derives geography from its own database, and feeding it Cloudflare's header
# would need a column type it has no place for.
goaccess_log_format: >-
  [%d:%t %^] %h - %v "%r" %s %b "%R" "%u" cf=%^ rt=%T
goaccess_date_format: "%d/%b/%Y"
goaccess_time_format: "%H:%M:%S"

# Persisted state, one database per site. Without it every run would see only
# the logs still on disk, so the numbers would reset each time logrotate ran.
# With it, history outlives the log files it came from.
goaccess_db_dir: /var/lib/goaccess

# How often the reports are rebuilt. A systemd timer, not cron: it keeps the
# schedule, the command and the failure handling in one unit the host already
# knows how to report on.
goaccess_interval: hourly

# The unprivileged account the reports are built as. It only needs to read
# /var/log/nginx (group adm) and write its own directories.
goaccess_user: goaccess

# Served on a port of its own, bound to loopback: reached over an SSH tunnel
#
#   ssh -L 8443:127.0.0.1:8443 <host>   then http://127.0.0.1:8443/
#
# rather than published. A subdomain would need a Cloudflare zone, a DNS record
# and an origin certificate, and it would put the list of domains and their
# traffic behind nothing but a password on the public internet. Binding to
# loopback means the firewall has nothing to close, because nothing outside the
# machine can reach the port in the first place.
goaccess_listen_address: 127.0.0.1
goaccess_listen_port: 8443

# Basic auth on top of the tunnel. The mechanism is the nginx role's — the same
# password file and snippet — because a second one would be a second thing to
# get wrong. Krot never decides which sites are published; this is its own page,
# so here it does decide, and the answer is always "closed".
goaccess_auth_enabled: true
