---
# Disabling password auth without a working key is how machines get locked away
# for good, so refuse before touching sshd rather than half-way through.
- name: Assert an SSH key is available before locking down password auth
  ansible.builtin.assert:
    that:
      - bootstrap_authorized_keys | length > 0
      - bootstrap_authorized_keys | select('match', '^(ssh|ecdsa)-') | list | length
        == bootstrap_authorized_keys | length
    fail_msg: >-
      bootstrap_authorized_keys is empty or malformed. Locking sshd now would
      leave no way back in. Unlock Bitwarden (/bw-unlock) and re-run.
    quiet: true

- name: Create the operator account
  ansible.builtin.user:
    name: "{{ bootstrap_user }}"
    shell: "{{ bootstrap_user_shell }}"
    groups: sudo
    append: true
    create_home: true
    state: present

- name: Authorize the operator's SSH keys
  ansible.posix.authorized_key:
    user: "{{ bootstrap_user }}"
    key: "{{ bootstrap_authorized_keys | join('\n') }}"
    # The key set in Bitwarden is the whole truth: a key revoked there has to
    # disappear from the host, which only exclusive mode guarantees.
    exclusive: true
    state: present

- name: Grant the operator passwordless sudo
  ansible.builtin.copy:
    content: "{{ bootstrap_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ bootstrap_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo --check --file=%s

- name: Prove the operator can log in with the new key
  ansible.builtin.command: "id -u {{ bootstrap_user }}"
  changed_when: false

- name: Harden sshd
  ansible.builtin.template:
    src: 99-krot.conf.j2
    dest: /etc/ssh/sshd_config.d/99-krot.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# Cloud-init's drop-in re-enables password auth and sorts before ours, so leaving
# it in place would silently undo the hardening above.
- name: Drop cloud-init sshd overrides that re-enable password auth
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ bootstrap_conflicting_dropins }}"
  notify: Restart sshd
