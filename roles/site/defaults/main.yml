---
# The variables every site_* role reads, in one place. The role is called just
# "site" so that its name is the prefix they all carry. Each site role depends on
# this one, so a default is written once: copies in eleven defaults files would
# drift one at a time, and a role reading its own stale copy fails no test.
#
# The roles know ONE site — the one named here — and nothing about whose it is.
# Project steps (fill, deploy, verify, open, writing the ids back) come in as the
# project's own task files, listed at the end.

# --- The site -----------------------------------------------------------------

# The registered domain, without www.
site_domain: ""

# The machine's address. It goes into proxied A records only, so Cloudflare
# never publishes it — see site_dns_records.
site_origin_ip: ""

# Where the site is asked for from outside. Tests point these at a fake; in
# production they are the site itself.
site_public_url: "https://{{ site_domain }}"
site_public_www_url: "https://www.{{ site_domain }}"

# --- Secrets ------------------------------------------------------------------
#
# Values, never names of vault entries: no role of this collection goes to a
# password manager (wiki/operations/secrets.md). The consumer's inventory holds
# the lookup; being lazy, it is evaluated where site_preflight asserts the value
# is non-empty — so a missing secret stops the launch before anything is created.

site_cloudflare_token: ""
site_dynadot_key: ""
site_umami_username: ""
site_umami_password: ""
site_google_service_account: ""
site_yandex_token: ""
site_bing_key: ""
site_uptimerobot_key: ""

# --- Cloudflare ---------------------------------------------------------------

# The account the zone lives in. Cloudflare hands out the nameserver pair per
# account, so a site moved to another account gets another pair.
site_cloudflare_account_id: ""
site_cloudflare_api_url: https://api.cloudflare.com/client/v4

# Zone settings: what a site behind an origin certificate needs. The browser
# cache TTL is 0 ("respect existing headers") because Cloudflare's default of
# four hours replaces the site's own Cache-Control.
site_cloudflare_settings_base:
  ssl: strict
  always_use_https: "on"
  browser_cache_ttl: 0
# The project's own values, laid over the base one by one, so naming one
# setting never drops the others. one project keeps browser_cache_ttl at 14400: its
# pages go out no-cache and nothing it serves reads the TTL.
site_cloudflare_settings: {}

# Extra rules for the zone, as cloudflare_ruleset takes them (each with a ref).
# one project's is the cache rule for photos served by routes.
site_cloudflare_rules: []
site_cloudflare_rules_phase: http_request_cache_settings

# --- Registrar ----------------------------------------------------------------

# dynadot, or none for a domain held elsewhere: then site_domain only reports
# the nameservers to set by hand.
site_registrar: dynadot
site_dynadot_api_url: https://api.dynadot.com/api3.json

# Two independent public resolvers over DNS-over-HTTPS; both must answer.
site_doh_resolvers:
  - https://dns.google/resolve
  - https://cloudflare-dns.com/dns-query

# --- Machine ------------------------------------------------------------------

# Where the vhost generators of consuming projects read the pair and write vhosts.
site_certificate_dir: /etc/nginx/ssl
site_vhost_dir: /etc/nginx/sites-enabled

# A directory that must already be on the machine before the deploy — the
# site's own directory inside the deployed main. Empty skips the precheck.
site_serve_precheck_path: ""

# --- Database (optional) ------------------------------------------------------

site_database_name: ""
site_database_owner: ""

# --- Analytics ----------------------------------------------------------------

# A consumer passes the whole dictionary, so a key it does not name is off, not
# inherited from here: the roles read cloudflare_web_analytics with a default of
# false, and the line below documents the switch rather than setting it for anyone.
#   umami                     the site's own counter, on the machine
#   cloudflare_web_analytics  Cloudflare's, inserted into the zone's HTML for every
#                             visitor, the EU included; no code in the site's templates
site_analytics:
  umami: true
  cloudflare_web_analytics: false
  ga4: false

# Umami answers on the machine itself; port and base path are the umami role's
# own variables, so the number is written in one place.
site_umami_api_url: "http://127.0.0.1:{{ umami_port | default(3000) }}{{ umami_base_path | default('') }}"

# No account or human owner fallback. Consumers enable ga4 for new sites.
site_ga4_account_id: ""
site_ga4_owner_email: ""
site_ga4_property_id: ""
site_ga4_stream_id: ""
site_ga4_reader_service_account: ""
site_ga4_api_url: https://analyticsadmin.googleapis.com/v1beta
site_ga4_access_api_url: https://analyticsadmin.googleapis.com/v1alpha
site_ga4_data_api_url: https://analyticsdata.googleapis.com/v1beta
site_ga4_access_wait_attempts: 8
site_ga4_access_wait_delay: 4

site_google_token_uri: https://oauth2.googleapis.com/token

# --- Monitoring (optional) ----------------------------------------------------

site_monitor:
  enabled: false
  # A word that must be on the watched page, case as written. Set: one keyword monitor,
  # "<domain> (Profile)". Empty: one plain HTTP monitor, "<domain>".
  keyword: ""
  # The page the keyword monitor watches: for one project it is a profile page (profil/,
  # profiel/, begleitung/ …), where losing the feed shows first.
  path: /
site_uptimerobot_api_url: https://api.uptimerobot.com/v3

# --- Search -------------------------------------------------------------------

site_search_engines: [google, yandex, bing]
site_sitemap_path: /sitemap.xml
# People who should see the Search Console property, besides the account.
site_search_console_owners: []
# The key the project reads Search Console and sends pages to Google with (collecting's gsc job,
# indexing's google engine), as JSON text. It must own the domain property: the Indexing API
# takes pages only from an owner. The launch makes it one with the launching key and proves it
# by its own read. Required while google is among site_search_engines; for a launch with the
# project's own key pass that same JSON here.
site_search_console_reader_service_account: ""
# Google left out of site_search_engines is a decision, not a default: without a reason here
# site_preflight stops the launch, and the reason is printed in its report.
site_search_console_off_reason: ""
site_google_api_url: https://www.googleapis.com
site_yandex_api_url: https://api.webmaster.yandex.net/v4
site_bing_api_url: https://ssl.bing.com/webmaster/api.svc/json

# How long to wait for an engine to see a DNS record: attempts x seconds.
site_search_wait_attempts: 6
site_search_wait_delay: 20

# --- Passport -----------------------------------------------------------------

# What the site says about itself to the network's ledger, at a path only the
# secret's holder can compute: "/" + the first 16 hex of
# sha256("<secret>:<domain>"). The country is required, and so is exactly one
# of the two tags below; the role stops without them.
site_passport_country: ""
# The site's topic, written as `topic`: a lower-case tag, not an entry of a list
# someone else keeps. The format is site_passport_tag_pattern.
site_passport_topic: ""
# The tag of the older contract, written as `profile`. For sites whose passport
# already says so and must not change; a new site names a topic. Naming both,
# or neither, stops the role.
site_passport_profile: ""
# A tag starts with a letter and goes on with lower-case letters, digits and
# hyphens, 32 characters at most (the reader's rule). \Z, not $: $ also matches
# before a trailing newline, and a tag that ends in one is another tag.
site_passport_tag_pattern: '^[a-z][a-z0-9-]{0,31}\Z'
# YYYY-MM-DD, or null to let the ledger take the age from the counter.
site_passport_launched: null
# Declared only by the consumer's inventory: new or drop; unknown stays null.
site_passport_origin: null
# Optional non-secret GA4 assignment. The consumer supplies the first complete
# day after tag installation in the property's calendar and keeps it on reruns.
# Null omits the key to retain the bytes of old passports.
site_passport_google_analytics: null
# A value, never a vault name, like the other secrets; empty stops the role.
site_passport_secret: ""
# The path is the only lock, so a short secret is refused (openssl rand -hex 16 gives 32).
site_passport_secret_min_length: 24
# Directories 0711 (no listing): the file's name is the lock.
site_passport_root: /var/lib/krot-passport
site_passport_snippet_dir: /etc/nginx/snippets

# --- Project ------------------------------------------------------------------

# Names (not values) that must be in the project's env file on the machine.
site_env_file: ""
site_env_required: []

# The project's own task files. Each answers "already done?" itself, changes
# nothing under --check, and runs wherever it chooses (delegate_to: localhost
# included). Empty skips the step.
site_project_fill: ""
site_project_deploy: ""
site_project_verify: ""
site_project_open: ""
site_results_writer: ""
