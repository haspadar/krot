---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

# Always before enabling ufw: the default deny policy below would otherwise cut
# the very connection running this play.
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp
    from_ip: "{{ firewall_ssh_from }}"

- name: Set default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Install the Cloudflare range refresh script
  ansible.builtin.template:
    src: krot-cf-ranges.sh.j2
    dest: /usr/local/sbin/krot-cf-ranges
    owner: root
    group: root
    mode: "0755"

- name: Configure web port access
  ansible.builtin.include_tasks: "{{ firewall_cloudflare_only | ternary('cloudflare.yml', 'open.yml') }}"
