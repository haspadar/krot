---
# One project against the cluster, before anything on the machine changes.
- name: Look for the project's database and reader
  community.postgresql.postgresql_query:
    login_db: postgres
    query: >-
      SELECT
        EXISTS (SELECT 1 FROM pg_database WHERE datname = %(database)s) AS database,
        EXISTS (SELECT 1 FROM pg_roles WHERE rolname = %(reader)s) AS reader
    named_args:
      database: "{{ collecting_plan.database }}"
      reader: "{{ collecting_plan.reader }}"
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: collecting_found

- name: Refuse a database or a reader that is not there
  ansible.builtin.assert:
    that:
      - collecting_found.query_result[0].database
      - collecting_found.query_result[0].reader
    fail_msg: >-
      {{ collecting_plan.name }}: database {{ collecting_plan.database }} or role
      {{ collecting_plan.reader }} is not in the cluster. The project creates both;
      this role only adds its schema.
    quiet: true

- name: Look for every additional reader role
  community.postgresql.postgresql_query:
    login_db: postgres
    query: SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = %(reader)s) AS present
    named_args:
      reader: "{{ item }}"
  loop: "{{ collecting_plan.extra_readers }}"
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: collecting_extra_readers

- name: Refuse additional readers missing from the cluster
  ansible.builtin.assert:
    that:
      - item.query_result[0].present
    fail_msg: "{{ collecting_plan.name }}: additional reader {{ item.item }} does not exist."
    quiet: true
  loop: "{{ collecting_extra_readers.results }}"
  loop_control:
    label: "{{ item.item }}"

# ⚠️ A krot_collect schema somebody else made is not adopted: schema.sql would
# then run against tables this role did not write.
- name: Look for a krot_collect schema already in the database
  community.postgresql.postgresql_query:
    login_db: "{{ collecting_plan.database }}"
    query: >-
      SELECT pg_get_userbyid(nspowner) AS owner FROM pg_namespace WHERE nspname = 'krot_collect'
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: collecting_schema_owner

- name: Refuse a krot_collect schema this role did not make
  ansible.builtin.assert:
    that:
      - collecting_schema_owner.query_result | length == 0
        or collecting_schema_owner.query_result[0].owner == collecting_user
    fail_msg: >-
      {{ collecting_plan.database }} already has a krot_collect schema owned by
      {{ collecting_schema_owner.query_result[0].owner | default('') }}, not
      {{ collecting_user }}. This role does not adopt it — find out whose it is first.
    quiet: true

# Checked, not assumed: peer maps the program's account to its Postgres role
# without a password, and a cluster that asks for one here would fail every night
# with a message about authentication.
- name: Read how the cluster lets the program in
  community.postgresql.postgresql_query:
    login_db: postgres
    query: >-
      SELECT auth_method FROM pg_hba_file_rules
      WHERE type = 'local'
        AND (database @> ARRAY['all'] OR database @> ARRAY[%(database)s])
        AND (user_name @> ARRAY['all'] OR user_name @> ARRAY[%(user)s])
      ORDER BY line_number LIMIT 1
    named_args:
      database: "{{ collecting_plan.database }}"
      user: "{{ collecting_user }}"
  become: true
  become_user: postgres
  check_mode: false
  changed_when: false
  register: collecting_hba

- name: Refuse a cluster that would ask the program for a password
  ansible.builtin.assert:
    that:
      - collecting_hba.query_result | length == 1
      - collecting_hba.query_result[0].auth_method == 'peer'
    fail_msg: >-
      pg_hba.conf does not let {{ collecting_user }} into {{ collecting_plan.database }}
      over the local socket by peer. The program has no password to offer.
    quiet: true
