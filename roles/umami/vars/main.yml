---
# Derived paths, here rather than in defaults because they are not choices: an
# inventory that overrode one of these would have to keep it consistent with
# umami_root by hand, and the two would eventually disagree.
umami_release_dir: "{{ umami_root }}/{{ umami_version }}"

# Inside the release directory on purpose. A stamp kept outside would outlive
# the tree it describes: a half-built release removed by hand would leave a
# stamp claiming a build that is no longer there, and the next run would skip
# building it.
umami_build_stamp: "{{ umami_release_dir }}/.build-complete"

# What the stamp records, so a change of any of it rebuilds. The base path is in
# here because Next compiles it into every emitted path: a machine that already
# built under one prefix would otherwise keep serving the old one forever, and
# the symptom is a panel whose assets 404 with no explanation anywhere.
umami_build_signature: "{{ umami_version }}:{{ umami_base_path }}"

# The lowest Node this application runs on. next@16 requires >=20.9 and
# prisma@7 requires ^20.19 || ^22.12 || >=24; upstream's own Dockerfile uses 22.
umami_node_required_major: 20

# Settings the unit owns, which `umami_environment` may not carry. Not a style
# rule: systemd applies EnvironmentFile after Environment=, so any of these
# coming from the inventory would override the unit and defeat the asserts that
# guard them.
umami_reserved_environment:
  - HOSTNAME
  - PORT
  - NODE_ENV
  - NODE_OPTIONS
  - DATABASE_URL
  - APP_SECRET
