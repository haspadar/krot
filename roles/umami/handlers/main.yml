---
# Deliberately empty of restart handlers: this role restarts the service inline,
# in `tasks/main.yml`, immediately after the unit and the schema are in place.
#
# A handler would defer that to the end of the play — past every remaining role,
# and past whatever else the play does to the machine. On a version bump that
# leaves a window where the schema is new and the running process is still the
# old build, and nothing reports it.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
