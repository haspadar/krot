---
# The Umami release to run, WITHOUT the leading v — the download URL adds it
# (`.../tags/v{{ umami_version }}.tar.gz`). Writing "v3.3.0" here builds a URL
# with two of them and answers 404, which reads as a withdrawn release rather
# than a typo.
#
# Pinned rather than tracking a branch: the build applies database migrations,
# so "whatever is on master today" would mean a schema change arriving on an
# unrelated provisioning run.
umami_version: "3.3.0"

# ⚠️ A tag is a MOVEABLE reference, and this role does not verify which commit
# it landed on — recorded as a known gap rather than a checked one.
#
# What was tried and does not work: GitHub's `archive/refs/tags/` tarball carries
# no commit metadata (verified 2026-08-20 by unpacking v3.3.0), so there is
# nothing in the tree to compare against. A checksum on the tarball does not fill
# the gap either — GitHub generates those archives on demand and has changed
# their compression, so the bytes are not stable while the commit is.
#
# The real fix is to fetch by commit SHA instead of by tag, which makes the tree
# immutable by construction. Left for when a version is next bumped, because it
# changes the URL shape and deserves its own measurement.
#
# What already limits the damage: `pnpm install --frozen-lockfile` pins every
# dependency by integrity hash, and the build runs as an unprivileged account.

# Where the checkout and its build live. One directory owned by the service
# account: the build writes into node_modules/ and .next/ as the same user that
# later runs the application, so there is no permission handover half way
# through.
umami_root: /opt/umami

# The account the service runs as, and the owner of the checkout. A system
# account with no login shell — the role creates it when missing.
umami_user: umami
umami_group: umami

# Loopback only, and not negotiable by accident. Umami's own start script
# defaults to 0.0.0.0, so leaving this unset opens the service to the world
# while everything looks healthy — the failure has no symptom until somebody
# scans the machine. The site's nginx reaches it over the loopback.
umami_bind_host: 127.0.0.1
umami_port: 3000

# The path the panel is reached at, when it is not the root. Empty means the
# root, which is what a service on a domain of its own wants.
#
# ⚠️ This is a BUILD-time setting, not a runtime one, and that is the whole
# reason it lives here rather than in `umami_environment`. Next bakes the value
# into every link and asset path it emits (next.config.ts: `basePath`), so a
# reverse proxy that rewrites the path without it gets a page that loads and is
# broken: the HTML arrives, every stylesheet and script under it 404s, and the
# panel looks like a failed deploy rather than a missing setting.
#
# Measured 2026-08-20 before setting it: `/login` emitted `/_next/static/...`
# from the root while nginx served it under a prefix.
#
# Changing it re-runs the build, because the value is compiled in — which is
# also why the stamp includes it.
umami_base_path: ""

# Where the counter keeps its data. No default: a wrong guess would point the
# service at a database belonging to something else, and the role has no way to
# tell the difference. Asserted in tasks/main.yml.
umami_database_url: ""

# Signs sessions and encrypts stored tokens. No default for the same reason,
# plus one of its own: Umami falls back to hashing DATABASE_URL when this is
# absent, so a machine without it works perfectly until the database password is
# rotated and every session on it dies at once. The symptom names the wrong
# cause, which is why this is required rather than defaulted.
umami_app_secret: ""

# Anything else the application should read, as plain key/value. Empty by
# default: a setting nobody asked for is a setting nobody can explain later.
umami_environment: {}

# Whether the role installs Node itself. Ubuntu 24.04 ships 18.19.1 and this
# application does not build on it, so the answer is normally yes — but a
# machine that already manages Node its own way should not have a second source
# added behind its back.
umami_manage_node: true
umami_node_version: 22

# How long the build may take, in seconds, and how much heap it may use.
#
# Twenty minutes because this is a Next.js production build of 88 dependencies
# on a shared machine; the poll interval is what keeps the play from blocking on
# it entirely.
umami_build_timeout: 1200

# Node sizes its default heap from TOTAL system memory rather than free memory,
# so on a box already serving sites the build climbs until the OOM killer
# intervenes — and the killer picks by its own score, which on a database
# machine lands on postgres as readily as on the build. A ceiling makes the
# build fail as the build.
#
# 1024 fits a 4GB machine with sites and a database on it. Raise it on a bigger
# box; do not remove it.
umami_build_memory_mb: 1024

# How much memory the running service may take. Separate from the build ceiling
# above and smaller: serving a counter is not compiling one.
#
# A limit rather than none, because this machine has 3.8 GB and a database on
# it — an unbounded Node process competing for the last of it gets postgres
# killed as readily as itself.
umami_memory_max: 512M

# The build runs beside live sites, so it yields to them. Not a limit on how
# long it takes — a limit on whose requests get slower while it does.
umami_build_nice: 10

# Whether to apply pending migrations. On by default: a build without its schema
# is a service that starts and answers errors.
umami_migrate: true

# Whether the role builds the application at all. On by default, because a
# machine with no build has nothing to run.
#
# Turned off, the role expects a tree to be at the release path already — put
# there by a build host, an image, or a copy from elsewhere. That is a real
# arrangement on a machine too small to compile on, not only a testing hook: the
# build wants a gigabyte of heap and fifteen minutes beside live sites.
umami_build: true
