---
- name: Skip update monitoring unless explicitly enabled
  ansible.builtin.meta: end_role
  when: not updates_monitor_enabled

- name: Validate monitoring configuration before writing files
  ansible.builtin.assert:
    that:
      - updates_monitor_secret is string
      - updates_monitor_secret | length >= 32
      - updates_monitor_port is integer
      - updates_monitor_max_age is integer
      - updates_monitor_stale_after is integer
      - updates_monitor_port | int > 1024
      - updates_monitor_port | int < 65536
      - updates_monitor_max_age | int > 0
      - updates_monitor_stale_after | int >= 7200
    quiet: true
  no_log: true

- name: Compute the private location
  ansible.builtin.set_fact:
    updates_monitor_path: "/_health/updates/{{ (updates_monitor_secret ~ ':' ~ inventory_hostname) | hash('sha256') }}"
  no_log: true

- name: Install the read-only update inspection tools
  ansible.builtin.apt:
    name: [python3-apt, unattended-upgrades, needrestart]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the update status directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /usr/local/lib/krot-updates, mode: "0755"}
    - {path: /var/lib/krot-updates, mode: "0755"}
    - {path: /etc/nginx/snippets, mode: "0755"}

- name: Install the collector and cached status reader
  ansible.builtin.copy:
    src: check.py
    dest: /usr/local/lib/krot-updates/check.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart updates HTTP

- name: Install the timer and services
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: collect.service.j2, dest: krot-updates-collect.service}
    - {src: collect.timer.j2, dest: krot-updates-collect.timer}
    - {src: http.service.j2, dest: krot-updates-http.service}
  notify:
    - Restart updates HTTP
    - Restart updates timer

- name: Write the private location for the consumer vhost
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/snippets/krot-updates.conf
    owner: root
    group: root
    mode: "0640"
  no_log: true

- name: Apply updated service definitions
  ansible.builtin.meta: flush_handlers

- name: Enable collection and cached HTTP
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - krot-updates-collect.timer
    - krot-updates-http.service
