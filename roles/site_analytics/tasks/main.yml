---
# Counters for the site. The ids come back as the fact site_analytics_results; the
# project's own site_results_writer puts them where its application reads them.
# This role writes nothing of the project's.

- name: Register the site in Umami
  # On the machine itself, where Umami listens on 127.0.0.1 — no tunnel, and
  # nobody but Umami writes Umami's database.
  haspadar.krot.umami_website:
    domain: "{{ site_domain }}"
    username: "{{ site_umami_username }}"
    password: "{{ site_umami_password }}"
    api_url: "{{ site_umami_api_url }}"
  when: site_analytics.umami | default(true)
  register: site_analytics_umami

# After site_dns_records, which stops until the zone is active: Cloudflare makes the
# zone's record on its own, and one made before that is the one this step would find
# in the lite form. The account comes from the zone unless the inventory names it.
- name: Turn Cloudflare Web Analytics on for every visitor
  haspadar.krot.cloudflare_web_analytics:
    zone_id: "{{ site_dns_zone_found.zone_id }}"
    account_id: "{{ site_cloudflare_account_id | default(omit, true) }}"
    api_token: "{{ site_cloudflare_token }}"
    api_url: "{{ site_cloudflare_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when:
    - site_analytics.cloudflare_web_analytics | default(false)
    - site_dns_zone_found.exists | default(false)

- name: Check the GA4 reader and explicit human owner before registration
  ansible.builtin.assert:
    that:
      - site_ga4_reader_service_account | length > 0
      - site_ga4_owner_email in site_search_console_owners
      - "'google' in site_search_engines"
    quiet: true
  when: site_analytics.ga4 | default(false)
  no_log: true

- name: Plan GA4 registration with the explicit human account
  haspadar.krot.ga4_property:
    domain: "{{ site_domain }}"
    account_id: "{{ site_ga4_account_id }}"
    owner_email: "{{ site_ga4_owner_email }}"
    property_id: "{{ site_ga4_property_id }}"
    stream_id: "{{ site_ga4_stream_id }}"
    service_account: "{{ site_google_service_account }}"
    token_uri: "{{ site_google_token_uri }}"
    api_url: "{{ site_ga4_api_url }}"
    access_api_url: "{{ site_ga4_access_api_url }}"
    google_api_url: "{{ site_google_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: site_analytics_ga4_plan
  check_mode: true
  when: site_analytics.ga4 | default(false)

# Google verification must precede GA registration on a new site. The sitemap is
# still submitted by site_search only after the project opens the site.
- name: Establish the human GSC ownership before GA4 registration
  ansible.builtin.include_role:
    name: haspadar.krot.site_search
    tasks_from: google-ownership
  when:
    - site_analytics.ga4 | default(false)
    - not (site_analytics_ga4_plan.owner_verified | default(false))

- name: Find or create the human-owned GA4 property and stream
  haspadar.krot.ga4_property:
    domain: "{{ site_domain }}"
    account_id: "{{ site_ga4_account_id }}"
    owner_email: "{{ site_ga4_owner_email }}"
    property_id: "{{ site_ga4_property_id }}"
    stream_id: "{{ site_ga4_stream_id }}"
    service_account: "{{ site_google_service_account }}"
    token_uri: "{{ site_google_token_uri }}"
    api_url: "{{ site_ga4_api_url }}"
    access_api_url: "{{ site_ga4_access_api_url }}"
    google_api_url: "{{ site_google_api_url }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: site_analytics_ga4
  when: site_analytics.ga4 | default(false)

- name: Prove the explicit reader can read GA4
  haspadar.krot.ga4_access:
    property_id: "{{ site_analytics_ga4.property_id }}"
    service_account: "{{ site_google_service_account }}"
    reader_service_account: "{{ site_ga4_reader_service_account }}"
    token_uri: "{{ site_google_token_uri }}"
    api_url: "{{ site_ga4_access_api_url }}"
    data_api_url: "{{ site_ga4_data_api_url }}"
    wait_attempts: "{{ site_ga4_access_wait_attempts }}"
    wait_delay: "{{ site_ga4_access_wait_delay }}"
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when:
    - site_analytics.ga4 | default(false)
    - site_analytics_ga4.property_id | default('') | length > 0

- name: Hand the ids to the project
  ansible.builtin.set_fact:
    site_analytics_results:
      umami_website_id: "{{ site_analytics_umami.website_id | default('') }}"
      ga4_property_id: "{{ site_analytics_ga4.property_id | default('') }}"
      ga4_stream_id: "{{ site_analytics_ga4.stream_id | default('') }}"
      ga4_measurement_id: "{{ site_analytics_ga4.measurement_id | default('') }}"
      ga4_account_id: "{{ site_analytics_ga4.account_id | default('') }}"
      ga4_owner_email: "{{ site_analytics_ga4.owner_email | default('') }}"
      ga4_timezone: "{{ site_analytics_ga4.time_zone | default('') }}"
