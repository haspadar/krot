---
# A site's day, for GA4, is its country's day. A property left on whatever zone
# its creator happened to be in cuts every German day an hour off — stadtdame
# counted its days by Europe/Minsk. Countries with more than one zone are not
# here on purpose: those name site_analytics_time_zone themselves.
site_analytics_time_zones:
  at: Europe/Vienna
  be: Europe/Brussels
  ch: Europe/Zurich
  cz: Europe/Prague
  de: Europe/Berlin
  dk: Europe/Copenhagen
  es: Europe/Madrid
  fi: Europe/Helsinki
  fr: Europe/Paris
  gb: Europe/London
  hu: Europe/Budapest
  ie: Europe/Dublin
  it: Europe/Rome
  lu: Europe/Luxembourg
  nl: Europe/Amsterdam
  "no": Europe/Oslo
  pl: Europe/Warsaw
  pt: Europe/Lisbon
  se: Europe/Stockholm
  sk: Europe/Bratislava
