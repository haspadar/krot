---
# Defaults to the inventory name: renaming a host is disruptive enough that it
# should be an explicit inventory decision, not something a role invents.
common_hostname: "{{ inventory_hostname }}"
common_timezone: Europe/Minsk

# What a person needs the moment they ssh in to find out why a machine is
# unwell — installed everywhere rather than apt-get'ed on the spot, because the
# moment you need them is the moment you would rather not be installing things.
#
# btop covers CPU, memory, disk and network on one screen; ncdu answers where
# the disk went, which htop cannot. ripgrep searches a gigabyte of access log in
# the time grep -r spends deciding where to start, and jq is what turns the JSON
# these services emit into something answerable — both earn their place on a box
# whose logs are the only thing to look at when a site misbehaves.
#
# fd-find installs its binary as `fdfind`, not `fd`: the name is taken by
# another package in Debian. No alias is set here — what a login shell offers is
# the operator's business, not the machine's.
common_base_packages:
  - btop
  - ca-certificates
  - curl
  - fd-find
  - git
  - htop
  - jq
  - ncdu
  - ripgrep
  - rsync
  - unzip

# Security updates only. Unattended feature upgrades on a machine serving live
# sites buy nothing and can restart services at random.
common_unattended_upgrades: true

# How much disk the systemd journal may hold. Unset, journald helps itself to
# 10% of the filesystem — 7.7 GB on a 77 GB disk — and simply keeps everything:
# busel's journal reached 1 GB holding every message since the machine was
# installed six weeks earlier, none of which anyone had read.
#
# A cap is not the same as a retention period, and the cap is the useful one
# here: it bounds what the journal costs regardless of how noisy the machine
# gets, whereas a period bounds the age and lets a bad day fill the disk. At
# busel's rate 500M is roughly three weeks — enough to look into an incident
# from last week, which is as far back as anyone has ever needed to go.
#
# Lowering this on a machine whose journal already exceeds it does not take
# effect until journald next rotates; `journalctl --vacuum-size` applies it now.
common_journal_max_use: 500M
