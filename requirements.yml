---
# Collections Krot's own roles depend on. Install with:
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=9.0.0"
  - name: community.postgresql
    # Capped below the next major: 5.0.0 (2026-09-15) arrived through an open
    # range and broke postgresql_ext on every machine's next run. A new major
    # is taken on purpose, after the scenarios pass on it.
    version: ">=3.4.0,<6.0.0"
