---
# Hosts are addressed by their ~/.ssh/config alias, so no ansible_host/IP lives
# in this repo: the origin IP is the one thing the busel network must never leak
# (see busel/docs/deployment.md, "Скрытие origin").
#
# Groups are named after the machine's role rather than the project, so a group
# never collides with the host of the same name.
all:
  children:
    recipients:
      hosts:
        busel:
    donors:
      hosts: {}
