---
# Bare-metal recipient machine: several sites behind Cloudflare, one system
# php-fpm/postgres/nginx shared by all of them.
krot_hostname: busel

# Deployer target. Ansible only creates the directory and its ownership; release
# contents belong to busel's deploy.php.
busel_deploy_path: /var/www/felix

php_version: "8.5"
postgresql_version: "16"

# nginx logs the real visitor IP restored from CF-Connecting-IP; the recipient
# counts impressions from these logs, so the format is part of the contract with
# busel's stats code (bin/stats-schema.sql).
nginx_log_format_name: felix

# No domain is registered yet, so the CF lock can be applied from day one
# without cutting off live traffic.
firewall_cloudflare_only: true
