---
# The role that makes a fresh machine usable: operator account, its groups, its
# keys, and sshd hardening.
#
# The hardening is exercised but not verified through a live connection —
# molecule reaches this container through docker exec, not ssh, so a locked-out
# sshd would not be noticed here. What is checked is the configuration the role
# wrote and the account it created, which is what the role promises; whether
# sshd then honours it is sshd's contract, tested by every real bootstrap.
driver:
  name: docker

dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

platforms:
  - name: krot-bootstrap
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../roles
  inventory:
    host_vars:
      krot-bootstrap:
        # Not `km`, the default: an account name that matched would be reached
        # whether the variable is honoured or not.
        bootstrap_user: krot-operator
        # Открытая половина ключа, и притом заведомо недействительная: после
        # обязательного префикса ed25519 стоят одни нули. Приватной половины нет ни у
        # кого, войти по нему нельзя. Роль обязана куда-то класть ключи, а сценарий —
        # проверять, что кладёт.
        bootstrap_authorized_keys:
          # secret-lint: allow — открытый ключ из нулей, приватной половины не существует
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ0000000000000000000000000000000000000000 molecule@example"
        # Left at the default on purpose. The groups are the point of this
        # scenario, and naming them here would test the inventory rather than
        # the default every machine actually gets.

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
