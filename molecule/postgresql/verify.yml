---
# Settings are read from the running server with SHOW, never from the config
# file. PostgreSQL accepts a reload for a postmaster-level setting and carries
# on with the old value — the file then says one thing and the server does
# another, which is precisely why the role restarts when PostgreSQL reports such
# a setting pending, and only then.
- name: Verify
  hosts: all
  vars:
    pg_version: "18"
  tasks:
    - name: Exactly one cluster exists, of the requested version
      ansible.builtin.command: pg_lsclusters --no-header
      register: clusters
      changed_when: false

    - name: It is the requested version, on the requested port, and online
      ansible.builtin.assert:
        that:
          - clusters.stdout_lines | length == 1
          - clusters.stdout_lines[0].split()[0] == pg_version
          - clusters.stdout_lines[0].split()[2] == "5432"
          - clusters.stdout_lines[0].split()[3] == "online"
        fail_msg: >-
          pg_lsclusters says "{{ clusters.stdout | trim }}". A second cluster,
          or one on 5433, is the measured failure: it never starts while the
          application keeps talking to the old one and everything looks healthy.
        quiet: true

    - name: The service is enabled at boot
      ansible.builtin.command: systemctl is-enabled postgresql@{{ pg_version }}-main
      register: pg_enabled
      changed_when: false
      failed_when: pg_enabled.stdout != "enabled"

    # What the server is actually running with. `SHOW` reports the value in
    # effect, so a setting that was written but silently not applied fails here.
    #
    # Of the ten, only two need the restart: max_connections and
    # shared_buffers are postmaster-level AND prepare gave them a different
    # value first, so a reload leaves 111 and 16384 in effect while the file
    # says 123 and 24576. Measured both ways.
    #
    # The other eight do not, and it is worth being exact about why, because the
    # list reads as if they all did. work_mem is context `user` and
    # log_min_duration_statement `superuser` — both apply on SIGHUP, so they
    # pass on a reload. log_destination likewise. listen_addresses and port are
    # postmaster-level but prepare already set them to these values, so there is
    # nothing for a restart to change. They check that the template rendered,
    # which is a different thing worth checking.
    #
    # So: dropping postgresql_max_connections and postgresql_shared_buffers from
    # molecule.yml, or setting them to what the server already runs, would make
    # this scenario green against a role that only reloads. Those two entries are
    # load-bearing — the note is there too.
    - name: Read the settings the server is actually running with
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        psql -tAc "select name || '=' || setting from pg_settings
        where name in ('max_connections','shared_buffers','work_mem',
        'log_min_duration_statement','log_destination','listen_addresses',
        'port','pg_stat_statements.max','log_filename','log_disconnections')"
      register: settings
      changed_when: false

    - name: They match what the scenario asked for
      ansible.builtin.assert:
        that: item in settings.stdout_lines
        fail_msg: >-
          "{{ item }}" is not in effect. The server is running with something
          other than what the role configured — a config file that was written
          and never applied looks identical from the filesystem.
        quiet: true
      loop:
        # shared_buffers and work_mem are reported in 8kB blocks and kB
        # respectively: 192MB = 24576 blocks, 6MB = 6144 kB.
        - max_connections=123
        - shared_buffers=24576
        - work_mem=6144
        - log_min_duration_statement=400
        - log_destination=csvlog
        - listen_addresses=localhost
        - port=5432
        - pg_stat_statements.max=4000
        # A name that repeats, so truncate-on-rotation recycles the set; and the
        # scenario's connection logging off (log_connections is a list in 18,
        # its sibling still a boolean, and one setting drives both).
        - log_filename=postgresql-%d.log
        - log_disconnections=off

    # A library only reaches shared memory at postmaster start. The role restarts
    # before creating the extension for exactly this, so checking that the
    # extension is usable also checks that the restart came first.
    - name: The extension is installed in the maintenance database
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        psql -tAc "select extname from pg_extension where extname =
        'pg_stat_statements'"
      register: ext
      changed_when: false
      failed_when: "'pg_stat_statements' not in ext.stdout"

    # Installed is not the same as working: the extension can exist in the
    # catalogue while the library is absent from shared_preload_libraries, and
    # every query against the view then errors out.
    - name: Its view answers, which needs the library actually loaded
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        psql -tAc "select count(*) >= 0 from pg_stat_statements"
      register: stat_view
      changed_when: false
      failed_when: stat_view.rc != 0 or stat_view.stdout | trim != "t"

    - name: The drop-in config has the ownership and mode the role promises
      ansible.builtin.stat:
        path: /etc/postgresql/{{ pg_version }}/main/conf.d/99-krot.conf
      register: dropin

    - name: 0640 postgres:postgres, readable by the server and nobody else
      ansible.builtin.assert:
        that:
          - dropin.stat.exists
          - dropin.stat.mode == "0640"
          - dropin.stat.pw_name == "postgres"
          - dropin.stat.gr_name == "postgres"
        fail_msg: >-
          99-krot.conf is {{ dropin.stat.mode | default('missing') }}
          {{ dropin.stat.pw_name | default('-') }}:{{ dropin.stat.gr_name | default('-') }}.
        quiet: true

    # prepare planted the legacy list. apt refuses to read two sources for one
    # repository, so leaving it would break every later package operation on the
    # machine — not only this role's.
    - name: The legacy pgdg source list is gone
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/pgdg.list
      register: legacy_list
      failed_when: legacy_list.stat.exists

    - name: The repository the role added is the one apt uses
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/pgdg.sources
      register: repo_file
      failed_when: not repo_file.stat.exists

    # apt update is the honest test of a source list: a malformed entry or a
    # keyring mismatch fails here and nowhere else until the next install.
    #
    # The exit code alone, having measured the three ways this can go wrong on
    # noble. All give rc=100:
    #
    #   duplicate source  E: Conflicting values set for option Signed-By ...
    #   garbage keyring   W: GPG error ... NO_PUBKEY, then E: ... is not signed
    #   missing keyring   the same pair
    #
    # This condition previously also matched 'NO_PUBKEY' and 'is misconfigured'
    # in stderr. The first is redundant — apt escalates it to an E: line and a
    # non-zero exit. The second was never emitted by any of the three, and a
    # clause that cannot fire reads as coverage while contributing none.
    - name: Apt can read the repository the role configured
      ansible.builtin.command: apt-get update
      register: apt_update
      changed_when: false

    # Everything except one unit that fails for being in a container, not for
    # anything this role did. `become_user: postgres` opens a user session, and
    # tearing it down runs user-runtime-dir@102, which cannot remove
    # /run/user/102: "Operation not permitted" — the container lacks the
    # privilege. Measured while the cluster stayed online and every check above
    # passed.
    #
    # Excluded by that one unit template rather than by clearing the check: a
    # blanket skip would also hide postgresql@18-main failing, which is the
    # thing this task exists to notice. The UID is left as \d+ because it is
    # whichever one the become_user session got — 102 in the measured run, but
    # nothing pins it. That is wider than the single unit observed, and the
    # widening is bounded: the template belongs to systemd-logind, no krot role
    # creates a user whose runtime dir could fail for a real reason, and if one
    # ever does, this line is what has to be narrowed.
    - name: Nothing on the machine is in a failed state
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_units
      changed_when: false
      failed_when: >-
        failed_units.stdout_lines
        | reject('search', 'user-runtime-dir@\d+\.service')
        | select('search', '\S')
        | list | length > 0

    # The other half of the decision: a change PostgreSQL applies on reload must
    # not restart it. Converge above always restarts (prepare left a different
    # max_connections running), so only a second pass changing nothing but a
    # sighup-level setting tells reload from restart: a restart moves the
    # postmaster's start time, a reload does not.
    - name: Remember when the postmaster started
      ansible.builtin.command: psql -XtAc "select pg_postmaster_start_time()"
      become: true
      become_user: postgres
      register: started_before
      changed_when: false

    - name: Run the role again with only work_mem changed
      ansible.builtin.include_role:
        name: postgresql
      vars:
        postgresql_work_mem: 7MB

    - name: Read the start time and work_mem after that pass
      ansible.builtin.command: >-
        psql -XtAc "select pg_postmaster_start_time() || ' ' || current_setting('work_mem')"
      become: true
      become_user: postgres
      register: started_after
      changed_when: false
      # A reload is a signal: the command returns before the postmaster has
      # re-read the file, and a backend forked in between still sees 6MB.
      until: started_after.stdout.endswith(' 7MB')
      retries: 10
      delay: 1

    - name: The new work_mem is in effect and the server was not restarted
      ansible.builtin.assert:
        that:
          - started_after.stdout == started_before.stdout ~ ' 7MB'
        fail_msg: >-
          Before "{{ started_before.stdout }}", after "{{ started_after.stdout }}".
          A moved start time is a restart for a change a reload applies — a
          5xx on every site of the machine for nothing.
        quiet: true

    # pg_file_settings says "setting could not be applied" for an invalid value as
    # well as for a restart-only change, so a role reading it would restart into a
    # config the server refuses. The run has to stop before the server is touched.
    - name: Run the role with a work_mem PostgreSQL refuses
      block:
        - name: The invalid pass
          ansible.builtin.include_role:
            name: postgresql
          vars:
            postgresql_work_mem: 0
        - name: Note that the invalid pass got through
          ansible.builtin.set_fact:
            invalid_accepted: true
      rescue:
        - name: Note that the invalid pass was refused
          ansible.builtin.set_fact:
            invalid_refused: true

    - name: Read the start time after the refused pass
      ansible.builtin.command: psql -XtAc "select pg_postmaster_start_time() || ' ' || current_setting('work_mem')"
      become: true
      become_user: postgres
      register: started_after_invalid
      changed_when: false

    - name: The invalid pass was refused and the server kept running untouched
      ansible.builtin.assert:
        that:
          - invalid_refused | default(false)
          - not (invalid_accepted | default(false))
          - started_after_invalid.stdout == started_before.stdout ~ ' 7MB'
        quiet: true

    # Dropping a preload library removes its line from the file, so there is no new
    # value to compare — only the server still holding the old one. It needs the
    # restart all the same.
    - name: Run the role with query statistics turned off
      ansible.builtin.include_role:
        name: postgresql
      vars:
        postgresql_stat_statements: false

    - name: Read the start time and preload list after that pass
      ansible.builtin.command: >-
        psql -XtAc "select pg_postmaster_start_time() || '|' || current_setting('shared_preload_libraries')"
      become: true
      become_user: postgres
      register: started_after_unload
      changed_when: false

    - name: The library is gone because the server was restarted
      ansible.builtin.assert:
        that:
          - started_after_unload.stdout.split('|')[1] == ''
          - started_after_unload.stdout.split('|')[0] != started_before.stdout
        quiet: true
