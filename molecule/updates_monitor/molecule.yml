---
driver:
  name: docker

dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

platforms:
  - name: krot-updates-monitor
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

provisioner:
  name: ansible
  env:
    # The role depends on haspadar.krot.site by its full name, so the
    # collection has to be importable; prepare.yml links this checkout in.
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_EPHEMERAL_DIRECTORY}/collections:${HOME}/.ansible/collections:${ANSIBLE_COLLECTIONS_PATH:-/usr/share/ansible/collections}"  # yamllint disable-line rule:line-length
  config_options:
    defaults:
      roles_path: ../../roles
  inventory:
    host_vars:
      krot-updates-monitor:
        updates_monitor_enabled: true
        updates_monitor_secret: molecule-private-updates-path-0123456789  # secret-lint: allow — throwaway

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
