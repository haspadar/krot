---
# systemd for real and a real cluster, as in the indexing scenario: the role's
# work is a schema in someone else's database, an account in the log group and
# units that read nginx's files as that account — nothing short of running the
# crawl shows the grants, the group and the peer mapping hold together.
#
# The ranges job is installed and not run: it asks eighteen operators' servers,
# and a scenario that depends on all of them answering fails on their evening,
# not on this role. Its logic is tested in tests/unit/collecting.
driver:
  name: docker

dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

platforms:
  - name: krot-collecting
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../roles
  inventory:
    host_vars:
      krot-collecting:
        # `other` has units on the machine and is named nowhere: another
        # project's, from its own inventory, and left alone.
        collecting_retired_projects: [gone]
        collecting_projects:
          molecule:
            database: molecule_site
            reader: molecule_app
            crawl:
              media_prefix: /media/
              ai_paths: true
              # A project's own monitor, looked for before the shared marks.
              extra_agents:
                - mark: watchdog-probe
                  family: monitor
              sections:
                rules:
                  - section: card
                    prefixes: [/card/]
                    bare: other
                bare_segment: place
                service_words: [imprint]
            sites:
              # Three files, one gzipped: read whole.
              - domain: whole.test
              # A truncated archive behind two good files: red, and the two
              # newer days kept.
              - domain: broken.test
              # A file of nothing but junk: red, nothing stored.
              - domain: junk.test
              # A file the program's account cannot open: red, nothing stored.
              - domain: locked.test
              # Declared and without a log yet: said, not failed.
              - domain: closed.test
          # Installed with its timers off, as a project moving history in does.
          quiet:
            database: molecule_quiet
            reader: molecule_app
            timers: false
            sites:
              - domain: whole.test
        # The indexing role on the same database, to show the two schemas stand
        # side by side: each program demands its own version row.
        indexing_projects:
          molecule:
            database: molecule_site
            reader: molecule_app
            engines: [indexnow]
            indexnow_secret: molecule-indexnow  # secret-lint: allow
            sites:
              - domain: molecule.test
                sitemap_url: http://127.0.0.1:9/sitemap.xml

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    # On a machine the role has not been on: --check must pass and show what it
    # would do, the schema and the account not there yet.
    - check
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
