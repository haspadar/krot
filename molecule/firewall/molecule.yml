---
# The default branch: 80/443 open to everyone, no Cloudflare lock. The
# firewall_cloudflare_only branch is a separate scenario, because the two
# configurations are mutually exclusive — one opens the web ports to the world
# and the other closes them, so a single converge cannot exercise both.
driver:
  name: docker

dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

platforms:
  - name: krot-firewall
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    # ufw needs to write real netfilter rules, which an unprivileged container
    # cannot do. Measured in this image: `ufw enable` produces INPUT policy DROP
    # and 63 ufw-* chains, so what the verification reads is the actual
    # ruleset — not ufw's own bookkeeping.
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../roles
  inventory:
    host_vars:
      krot-firewall:
        firewall_cloudflare_only: false

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
