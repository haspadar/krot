---
# Two containers, and the second one is the point: the upload is signed with
# SigV4 written by hand, and a scenario that stubbed the storage would test
# everything except the part most likely to be wrong. MinIO speaks the same
# protocol R2 does, so a signature it rejects R2 would reject too. Acceptance is
# strong evidence rather than proof: MinIO is not R2, and nothing here runs
# against R2 itself.
driver:
  name: docker

dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

platforms:
  - name: krot-backup
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
    networks:
      - name: krot-backup-net

  - name: krot-backup-storage
    # Pigsty's build of MinIO, pinned. Upstream stopped serving images
    # anonymously in both places this scenario tried: Docker Hub's minio/minio
    # ("pull access denied", CI 2026-09-23) and then quay.io/minio/minio
    # ("unauthorized", CI 2026-09-26, twice). pgsty/minio is a maintained fork
    # that still publishes multi-arch releases and, like upstream, carries mc,
    # which prepare.yml and verify.yml run inside this container.
    #
    # Pinned by digest, not by tag: the fork's Docker Hub repository has tag
    # immutability off, so RELEASE.2026-08-04T00-00-00Z could be re-pushed with
    # different contents and no trace here. The digest is the multi-arch index
    # of that release (amd64 for CI, arm64 for a Mac).
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    pre_build_image: true
    env:
      MINIO_ROOT_USER: molecule
      # Выдуманная учётка: живёт только внутри контейнера сценария, на
      # приватной сети, и наружу не выходит.
      MINIO_ROOT_PASSWORD: molecule-secret  # secret-lint: allow
    networks:
      - name: krot-backup-net

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../roles
  inventory:
    host_vars:
      krot-backup:
        # http, because MinIO here serves plain. The scheme is explicit rather than
        # implied: production is https and the role defaults to it, so a scenario
        # that relied on the default would not exercise the parsing at all.
        backup_s3_endpoint: http://krot-backup-storage:9000
        backup_s3_bucket: molecule-backups
        backup_s3_key: molecule
        # secret-lint: allow — та же выдуманная учётка, что у контейнера выше.
        backup_s3_secret: molecule-secret
        backup_s3_region: us-east-1
        backup_prefix: molecule
        # ⚠️ TWO entries, deliberately. A one-entry list renders correctly even
        # when the join is broken, so a scenario with one exclusion passes over
        # the defect instead of catching it — which is exactly what happened.
        # ⚠️ Both scratch names among them, spelled the way the defaults derive
        # them. The scenario replaces this list wholesale, so a scratch excluded
        # only in defaults is not excluded here — which is how a leftover
        # restore scratch got copied without any test noticing.
        backup_exclude_databases:
          - postgres
          - molecule_skipped
          - "{{ backup_verify_database }}"
          - "{{ backup_verify_database }}_restore"
        # The rehearsal is exercised by verify.yml directly rather than left to
        # its monthly timer, which would never fire inside a scenario.
        backup_verify: true

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
