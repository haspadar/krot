---
# Three tasks, but the substance is the template: jails, the systemd backend,
# and a port that comes from a different role's variable.
#
# The point of a fail2ban test is not that the file was written — it is that
# fail2ban parsed it and is running the jail. A typo in jail.local leaves the
# file perfectly present while the service refuses to start, which is the
# failure worth catching.
driver:
  name: docker

dependency:
  name: galaxy
  options:
    requirements-file: ../requirements.yml

platforms:
  - name: krot-fail2ban
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../roles
  inventory:
    host_vars:
      krot-fail2ban:
        # All four differ from the role's defaults, so a value read back from
        # the running fail2ban proves the template put it there rather than
        # matching what the package already ships.
        fail2ban_bantime: 2h
        fail2ban_findtime: 15m
        fail2ban_maxretry: 3
        fail2ban_ignoreip:
          - 127.0.0.1/8
          - ::1
          - 10.44.0.0/16

        # The template reads this through `firewall_ssh_port | default(22)`, and
        # the variable belongs to the firewall role, not this one. Set to a
        # non-default here so the [sshd] jail's port proves the two roles are
        # actually wired together — at 22 the default and the value are the same
        # string, and a broken lookup would be invisible.
        firewall_ssh_port: 2222

        # An extra jail, because the loop that renders them is the part of this
        # template most likely to be wrong: nested for, a dict of options, and
        # the blank line between entries that keeps the ini valid.
        fail2ban_extra_jails:
          - name: nginx-http-auth
            options:
              logpath: /var/log/nginx/error.log
              maxretry: 2

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
