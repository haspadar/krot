---
# A new site names a topic, and the body says `topic` instead of `profile`.
# The path and the nginx snippet do not depend on the tag, so they stay as they
# were. The passport is put back to its `profile` at the end: what follows in
# verify.yml compares the two existing files with what they were.
- name: Apply a topic to the existing dated passport
  ansible.builtin.include_role:
    name: site_passport
  vars:
    site_domain: www.Second.TEST.  # noqa: var-naming[no-role-prefix]
    site_passport_country: DE
    # The scenario's inventory names a profile for the main site: this site names none.
    site_passport_profile: ""
    site_passport_topic: travel
    site_passport_launched: "2026-01-15"
    site_passport_origin: drop

- name: Read the passport from the same independently computed path
  ansible.builtin.slurp:
    src: "{{ root }}/second.test/{{ second_path }}"
  register: topic_body

- name: It says topic and no profile, and the rest is as before
  ansible.builtin.assert:
    that:
      - >-
        (topic_body.content | b64decode)
        == '{"country":"DE","topic":"travel","launched":"2026-01-15","origin":"drop"}' ~ "\n"
    quiet: true

- name: Read the snippet after the tag changed
  ansible.builtin.slurp:
    src: /etc/nginx/snippets/krot-passport-second.test.conf
  register: topic_snippet

- name: The nginx snippet is byte for byte unchanged
  ansible.builtin.assert:
    that: topic_snippet.content == original_snippet.content
    quiet: true

- name: Put the dated passport back to its profile
  ansible.builtin.include_role:
    name: site_passport
  vars:
    site_domain: www.Second.TEST.  # noqa: var-naming[no-role-prefix]
    site_passport_country: DE
    site_passport_profile: dir
    site_passport_launched: "2026-01-15"
    site_passport_origin: drop

- name: Read it again
  ansible.builtin.slurp:
    src: "{{ root }}/second.test/{{ second_path }}"
  register: restored_body

- name: It says profile dir again, byte for byte as converge wrote it
  ansible.builtin.assert:
    that: >-
      (restored_body.content | b64decode)
      == '{"country":"DE","profile":"dir","launched":"2026-01-15","origin":"drop"}' ~ "\n"
    quiet: true
