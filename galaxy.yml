---
namespace: haspadar
name: krot
version: 5.3.0
readme: README.md
authors:
  - haspadar
description: >-
  Ansible roles for provisioning Ubuntu machines: operator access, firewall with
  an optional Cloudflare-only lock, fail2ban, PHP-FPM, PostgreSQL, nginx, Docker
  and periodic application jobs.
license:
  - MIT
tags:
  - system
  - web
  - security
repository: https://github.com/haspadar/krot
# Consumers get these pulled in automatically when they install the collection.
dependencies:
  ansible.posix: ">=1.5.4"
  community.general: ">=9.0.0"
  community.postgresql: ">=3.4.0"
build_ignore:
  - .github
  - .ansible-lint
  - .yamllint
  - ansible.cfg
  - inventory
  - playbooks
  # Development history, not something the installed collection needs to carry.
  - openspec
  # Same reasoning: the scenarios test the roles, they are not part of what a
  # consumer installs. Left out of the build, they would otherwise ship a
  # throwaway HTTP-server unit and a playbook that opens 80/443 — inert on a
  # consumer's machine, but with no business being there.
  - molecule
  # These are in .gitignore, which ansible-galaxy does not read — measured, the
  # tarball carried 5282 entries from them. `collections/` is a vendored copy of
  # other people's collections, which a consumer resolves for themselves;
  # CLAUDE.md is instructions for an agent working ON this repository and has no
  # meaning inside an installed copy of it; .ruff_cache is a linter's scratch
  # directory. The CI build step does not catch any of this — it only checks
  # that the build succeeds, not what ends up inside.
  - collections
  - CLAUDE.md
  - .ruff_cache
  - .gitignore
  - .idea
  - .ansible
