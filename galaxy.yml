---
namespace: haspadar
name: krot
version: 0.1.0
readme: README.md
authors:
  - haspadar
description: >-
  Ansible roles for provisioning Ubuntu machines: operator access, firewall with
  an optional Cloudflare-only lock, fail2ban, PHP-FPM, PostgreSQL, nginx and
  Docker.
license:
  - MIT
tags:
  - system
  - web
  - security
repository: https://github.com/haspadar/krot
# Consumers get these pulled in automatically when they install the collection.
dependencies:
  ansible.posix: ">=1.5.4"
  community.general: ">=9.0.0"
  community.postgresql: ">=3.4.0"
build_ignore:
  - .github
  - .ansible-lint
  - .yamllint
  - ansible.cfg
  - inventory
  - playbooks
