---
name: lint

"on":
  push:
    branches: [main]
  pull_request:

# Grouped by ref rather than by SHA: a SHA-based group never matches across two
# pushes and would therefore cancel nothing, while looking like a working
# setting. Measured before Molecule existed, this saved 58 seconds out of 3419
# (1.7%) — it is here for what Molecule made of a run, not for that figure: a
# burst of pushes now queues minutes rather than seconds.
#
# The flip side, recorded in the Molecule change: a scenario cancelled halfway
# leaves its container behind. On a throwaway runner that costs nothing; run
# `molecule destroy --all` if it ever happens locally.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything back: these jobs read the tree, run linters and a
# container. Stated explicitly because the default token is far broader, and a
# workflow that never declares its permissions silently keeps whatever the
# repository setting hands out.
permissions:
  contents: read

# Actions are pinned by commit SHA with the version in a comment, matching busel.
# A tag like v5 is movable: whoever owns the action can repoint it, and CI would
# then run someone else's code holding this repository's token. The comment is
# what makes the pin readable; the SHA is what makes it a pin.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history, not the default shallow clone: wiki-index.py restores PR numbers
      # from merge commits, and at depth=1 every one of them silently becomes a dash.
      #
      # persist-credentials: false — checkout otherwise leaves the token in
      # .git/config, where any later step, or anything that packages the
      # directory, can read it. Nothing here pushes, so it is never needed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Not `cache: pip` on setup-python: it looks for requirements.txt or
      # pyproject.toml, and this repository has neither — the linters are named
      # on the pip command line. With nothing to key on, setup-python does not
      # warn, it **errors**, and since it is the second step, everything after
      # it is skipped: yamllint, ansible-lint, secret-lint, the lot. Measured on
      # run 31973846564, where all twelve checks went red without a single one
      # of them running.
      #
      # The key hangs on this workflow file, which is where the installed
      # package names live. Editing the pip line therefore invalidates it.
      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: >-
            pip-lint-${{ runner.os }}-${{
            hashFiles('.github/workflows/lint.yml') }}

      - name: Install linters
        run: pip install ansible-lint yamllint

      # Keyed on the hash of requirements.yml, so changing a dependency
      # invalidates the cache, and there are no restore-keys — an exact match or
      # nothing.
      #
      # What that does NOT buy: the file pins ranges (">=1.5.4"), so the hash
      # stays put while the version a fresh install would resolve to moves on.
      # A hit therefore keeps yesterday's resolution, and CI can stay green on a
      # collection version no consumer would now get. That is the ordinary price
      # of caching rather than a hole to plug here, but it is worth not
      # mistaking this key for protection against it.
      - name: Cache collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: collections-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      # ansible-lint resolves modules from these, so a missing collection would
      # show up as a false "unknown module" failure.
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      # Catches a malformed galaxy.yml or a role the manifest cannot package —
      # neither shows up in linting, but both break every consumer's install.
      - name: Build the collection
        run: ansible-galaxy collection build --output-path /tmp/krot-build

      - name: wiki-lint
        run: python3 scripts/wiki-lint.py

      # wiki-lint has carried secret patterns since the wiki was set up, but it
      # only walks wiki/. This runs the same patterns over everything git
      # tracks — the blind spot was found the hard way, by a hardcoded test
      # password landing in molecule/ and matching wiki-lint's own regex while
      # no linter was looking at that directory.
      - name: secret-lint
        run: python3 scripts/secret-lint.py

      # wiki/index/ is generated from roles/, openspec/ and git. A stale index is
      # worse than none: it states a role is explained when nothing explains it.
      # Regenerating in CI turns that into a failure instead of a quiet lie.
      #
      # `git status --porcelain`, not `git diff --exit-code`: a deleted index file
      # comes back as untracked, which `git diff` does not report at all — the check
      # would pass on the one case where the index is missing outright.
      - name: wiki-index is up to date
        run: |
          python3 scripts/wiki-index.py
          if [ -n "$(git status --porcelain -- wiki/index/)" ]; then
            echo "wiki/index/ разошёлся с источниками — пересобери:"
            echo "  python3 scripts/wiki-index.py"
            git status --porcelain -- wiki/index/
            git diff -- wiki/index/
            exit 1
          fi

      # Prints the reach figure on every run, and fails only when a role appears
      # in no list at all — a role nobody named reads as checked while nothing
      # checks it.
      - name: Every role is named as covered, planned or excluded
        run: python3 scripts/coverage.py

  # The matrix is read from the directory rather than listed here. A hand-kept
  # list has to be edited twice when a scenario is added, and the half that gets
  # forgotten is this one — where a missing entry means the scenario silently
  # never runs, which looks exactly like a scenario that passes.
  scenarios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Collect the scenario names
        id: find
        run: |
          # A read loop rather than a find | xargs pipeline: -print0 with
          # xargs -0 needs a second delimiter switch for basename, and that
          # spelling is GNU-only. This form is portable and, unlike the
          # pipeline, can be run to completion on the author's machine.
          list=$(
            find molecule -mindepth 2 -maxdepth 2 -name molecule.yml -print \
              | while IFS= read -r f; do basename "$(dirname "$f")"; done \
              | sort | jq -R . | jq -sc .
          )
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"
          # An empty matrix is not an error to GitHub — it skips the job and
          # reports green, so a broken find would read as "all scenarios pass".
          [ "$list" != "[]" ] || { echo "no scenarios found under molecule/"; exit 1; }

  # One job per scenario, so the wait is the slowest scenario rather than their
  # sum. Measured on the run of 2026-08-16: nine scenarios, 783s in total, the
  # slowest (firewall_cloudflare) 136s. The machine time is unchanged — it is
  # the person who stops waiting for it, and on a public repository those
  # minutes are free.
  #
  # A red role run stays distinguishable from a red linter at a glance, and now
  # also names the role that broke.
  #
  # These legs are NOT what gates merges. Main's protection requires the checks
  # `lint` and `molecule` (verified through the API, not assumed), and a matrix
  # reports one check per leg — `molecule (php)` and so on. Nothing would ever
  # report plain `molecule` again, and a required check that never arrives
  # blocks every PR permanently, with `enforce_admins: true` leaving no way
  # round it. The `molecule` name is therefore kept alive by the gate job at the
  # bottom of this file; do not rename either without changing the protection
  # settings first.
  molecule-scenario:
    needs: scenarios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One broken scenario should not hide the state of the other eight: the
      # point of splitting them up is to learn which ones are red in one run.
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.scenarios.outputs.list) }}
    name: molecule (${{ matrix.scenario }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Same reasoning as in the lint job: no requirements.txt to key on, so
      # the cache is declared here rather than through setup-python.
      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: >-
            pip-molecule-${{ runner.os }}-${{
            hashFiles('.github/workflows/lint.yml') }}

      - name: Install Molecule
        run: pip install molecule 'molecule-plugins[docker]' ansible-core

      # Both requirements files in the key: a scenario needs the collection's
      # own dependencies as well as the driver's.
      - name: Cache collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: >-
            collections-${{ runner.os }}-${{
            hashFiles('requirements.yml', 'molecule/requirements.yml') }}

      # community.docker drives the container itself, so a missing one fails
      # `create` before any role code runs — an error that reads like a broken
      # scenario rather than a missing collection.
      - name: Install the scenarios' collections
        run: ansible-galaxy collection install -r molecule/requirements.yml

      - name: The collection's own dependencies
        run: ansible-galaxy collection install -r requirements.yml

      # `test` rather than `converge`: the sequence includes idempotence, which
      # is the promise this whole job exists to keep honest.
      - name: molecule test
        run: molecule test --scenario-name "${{ matrix.scenario }}"

  # The check main's protection actually requires. It exists because a matrix
  # cannot report under a single name, and it holds the name the protection
  # already knows.
  #
  # `if: always()` plus an explicit look at the results, rather than `needs`
  # alone: a needed job that fails **skips** its dependents, and a skipped
  # required check is not a red one. Which way it then goes wrong depends on how
  # it was skipped — the check either hangs pending, blocking the PR for good,
  # or reports success and waves the failure through. Both are worse than red,
  # so the job runs in all cases and decides for itself. The same applies to a
  # cancelled run, which `concurrency` above produces on every second push.
  molecule:
    needs: [scenarios, molecule-scenario]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every scenario passed
        run: |
          echo "scenarios: ${{ needs.scenarios.result }}"
          echo "molecule-scenario: ${{ needs.molecule-scenario.result }}"
          # 'success' is the only acceptable result for either. Note that a
          # matrix rolls its legs up into one result here, and 'skipped' has to
          # be rejected as well: an empty matrix skips the legs and would
          # otherwise pass the gate without running a single scenario.
          [ "${{ needs.scenarios.result }}" = "success" ] \
            && [ "${{ needs.molecule-scenario.result }}" = "success" ]
