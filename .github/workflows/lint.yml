---
name: lint

"on":
  push:
    branches: [main]
  pull_request:
  # Molecule scenarios are not part of a pull request or a push to main: they
  # run real containers, take minutes, and nobody is waiting on them at the
  # time they matter. A role is checked before merge on the machine of whoever
  # changes it (scripts/molecule-fast.py, wiki/operations/testing-roles.md);
  # the whole matrix runs weekly for what no push touched — a base image or a
  # collection moving under roles nobody edited — and by hand before a large
  # move, optionally limited to the scenarios named in the input.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenarios to run: 'all' or a comma-separated list, e.g. php,nginx"
        required: false
        default: all

# Grouped by ref rather than by SHA: a SHA-based group never matches across two
# pushes and would therefore cancel nothing, while looking like a working
# setting. Measured before Molecule existed, this saved 58 seconds out of 3419
# (1.7%) — it is here for what Molecule made of a run, not for that figure: a
# burst of pushes now queues minutes rather than seconds.
#
# The flip side, recorded in the Molecule change: a scenario cancelled halfway
# leaves its container behind. On a throwaway runner that costs nothing; run
# `molecule destroy --all` if it ever happens locally.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything back: these jobs read the tree, run linters and a
# container. Stated explicitly because the default token is far broader, and a
# workflow that never declares its permissions silently keeps whatever the
# repository setting hands out.
permissions:
  contents: read

# Actions are pinned by commit SHA with the version in a comment.
# A tag like v5 is movable: whoever owns the action can repoint it, and CI would
# then run someone else's code holding this repository's token. The comment is
# what makes the pin readable; the SHA is what makes it a pin.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A real Postgres for krot-index's store: an upsert, a unique key and "forget
    # what the site dropped" are questions about the database itself, and a fake
    # would only repeat the answers it was written from. The major version the
    # machines run; the tests skip without KROT_TEST_POSTGRES, so this is what
    # makes them run here rather than pass by being skipped.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: krot-units  # secret-lint: allow — throwaway, dies with the runner
          POSTGRES_DB: krot_units
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # secret-lint: allow — the throwaway server above, reachable only from this runner
      KROT_TEST_POSTGRES: "host=localhost port=5432 user=postgres password=krot-units dbname=krot_units"
    steps:
      # Full history, not the default shallow clone: wiki-index.py restores PR numbers
      # from merge commits, and at depth=1 every one of them silently becomes a dash.
      #
      # persist-credentials: false — checkout otherwise leaves the token in
      # .git/config, where any later step, or anything that packages the
      # directory, can read it. Nothing here pushes, so it is never needed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Not `cache: pip` on setup-python: it looks for requirements.txt or
      # pyproject.toml, and this repository has neither — the linters are named
      # on the pip command line. With nothing to key on, setup-python does not
      # warn, it **errors**, and since it is the second step, everything after
      # it is skipped: yamllint, ansible-lint, secret-lint, the lot. Measured on
      # run 31973846564, where all twelve checks went red without a single one
      # of them running.
      #
      # The key hangs on this workflow file, which is where the installed
      # package names live. Editing the pip line therefore invalidates it.
      #
      # Worth little, and measured rather than assumed: with the cache hit,
      # `Install linters` went 8s -> 7s, while the collections cache below went
      # 9s -> 1s. What is cached here are the downloaded wheels, and downloading
      # was never the slow part — unpacking and installing them is. Kept because
      # a second of a public repository's free minutes costs nothing; do not
      # expect more of it.
      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: >-
            pip-lint-${{ runner.os }}-${{
            hashFiles('.github/workflows/lint.yml') }}

      - name: Install linters
        run: pip install ansible-lint yamllint pytest pytest-xdist psycopg2-binary

      # Keyed on the hash of requirements.yml, so changing a dependency
      # invalidates the cache, and there are no restore-keys — an exact match or
      # nothing.
      #
      # What that does NOT buy: the file pins ranges (">=1.5.4"), so the hash
      # stays put while the version a fresh install would resolve to moves on.
      # A hit therefore keeps yesterday's resolution, and CI can stay green on a
      # collection version no consumer would now get. That is the ordinary price
      # of caching rather than a hole to plug here, but it is worth not
      # mistaking this key for protection against it.
      - name: Cache collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: collections-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      # ansible-lint resolves modules from these, so a missing collection would
      # show up as a false "unknown module" failure.
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      # Catches a malformed galaxy.yml or a role the manifest cannot package —
      # neither shows up in linting, but both break every consumer's install.
      - name: Build the collection
        run: ansible-galaxy collection build --output-path /tmp/krot-build

      # Here rather than in a job of its own: `lint` is already a required check,
      # and a new job would have to be added to main's protection by hand — until
      # someone did, red unit tests would not stop a merge. ansible-lint above
      # brings ansible-core, which is all the modules need.
      #
      # Two runs, because most of the 1000-odd tests start ansible-playbook and
      # are independent — measured 134s serially — while three files share one
      # database (one schema, dropped and recreated per test), and cannot run
      # beside each other. The parallel run leaves those files out, the second
      # runs only them. A new file that uses the database belongs in `db` below.
      - name: Module unit tests
        run: |
          db="tests/unit/collecting/test_collect_store.py
          tests/unit/indexing/test_store.py"
          python3 -m pytest tests/unit -q -p no:cacheprovider -n auto \
            $(for f in $db; do echo "--ignore=$f"; done)
          python3 -m pytest $db -q -p no:cacheprovider

      # DOCUMENTATION is YAML inside a Python string: yamllint skips .py files and
      # pytest never parses it, so a broken one reaches main unseen — it did once.
      - name: Module documentation parses
        run: python3 scripts/module-docs.py

      - name: wiki-lint
        run: python3 scripts/wiki-lint.py

      # wiki-lint has carried secret patterns since the wiki was set up, but it
      # only walks wiki/. This runs the same patterns over everything git
      # tracks — the blind spot was found the hard way, by a hardcoded test
      # password landing in molecule/ and matching wiki-lint's own regex while
      # no linter was looking at that directory.
      - name: secret-lint
        run: python3 scripts/secret-lint.py

      # The collection does not know who consumes it: no project and no real
      # site of one in code, tests or scenarios. Compared by hash, so the
      # script does not name what it forbids.
      - name: names-lint
        run: python3 scripts/names-lint.py

      # wiki/index/ is generated from roles/, openspec/ and git. A stale index is
      # worse than none: it states a role is explained when nothing explains it.
      # Regenerating in CI turns that into a failure instead of a quiet lie.
      #
      # `git status --porcelain`, not `git diff --exit-code`: a deleted index file
      # comes back as untracked, which `git diff` does not report at all — the check
      # would pass on the one case where the index is missing outright.
      #
      # On a push to main — and on the weekly or manual run, which checks out
      # main's tip — HEAD is the PR's own merge commit, which names the
      # PR number of a change archived in that same PR; the index committed in
      # the branch could not know it. Reading merges from HEAD^1 checks the
      # index as the PR saw it — the number arrives with the next rebuild.
      - name: wiki-index is up to date
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            export WIKI_INDEX_MERGES_FROM=HEAD^1
          fi
          python3 scripts/wiki-index.py
          if [ -n "$(git status --porcelain -- wiki/index/)" ]; then
            echo "wiki/index/ разошёлся с источниками — пересобери:"
            echo "  python3 scripts/wiki-index.py"
            git status --porcelain -- wiki/index/
            git diff -- wiki/index/
            exit 1
          fi

      # Prints the reach figure on every run, and fails only when a role appears
      # in no list at all — a role nobody named reads as checked while nothing
      # checks it.
      - name: Every role is named as covered, planned or excluded
        run: python3 scripts/coverage.py

  # Scenarios run on the weekly schedule and on request only. The matrix is read
  # from the directory rather than listed here: a hand-kept list has to be
  # edited twice when a scenario is added, and the half that gets forgotten is
  # this one — where a missing entry means the scenario silently never runs,
  # which looks exactly like a scenario that passes.
  #
  # A by-hand run may name scenarios; a name that is not a directory under
  # molecule/ fails the run instead of being dropped, because a scenario that
  # silently did not run looks like one that passed.
  scenarios:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Choose the scenarios
        id: find
        env:
          REQUESTED: ${{ github.event.inputs.scenarios }}
        run: |
          all=$(find molecule -mindepth 2 -maxdepth 2 -name molecule.yml \
            | cut -d/ -f2 | sort | jq -R . | jq -sc .)
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = all ]; then
            list="$all"
          else
            list=$(jq -c --arg r "$REQUESTED" '
              ($r | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $want
              | if ($want - .) != [] then error("unknown scenario: " + (($want - .) | join(","))) else $want end
            ' <<<"$all")
          fi
          echo "$list"
          [ "$(jq length <<<"$list")" -gt 0 ]
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # One job per scenario, so the wait is the slowest scenario rather than their
  # sum. A red role run stays distinguishable from a red linter at a glance, and
  # names the role that broke.
  #
  # Nothing here is a required check on main: protection requires `lint` only.
  # A matrix reports one check per leg (`molecule (php)`), so a required plain
  # `molecule` never arrives and would block every pull request for good —
  # which is why the aggregator job that used to hold that name is gone along
  # with the requirement.
  molecule-scenario:
    needs: scenarios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One broken scenario should not hide the state of the others: the point
      # of splitting them up is to learn which ones are red in one run.
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.scenarios.outputs.list) }}
    name: molecule (${{ matrix.scenario }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Same reasoning as in the lint job: no requirements.txt to key on, so
      # the cache is declared here rather than through setup-python.
      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: >-
            pip-molecule-${{ runner.os }}-${{
            hashFiles('.github/workflows/lint.yml') }}

      - name: Install Molecule
        run: pip install molecule 'molecule-plugins[docker]' ansible-core

      # Both requirements files in the key: a scenario needs the collection's
      # own dependencies as well as the driver's.
      - name: Cache collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: >-
            collections-${{ runner.os }}-${{
            hashFiles('requirements.yml', 'molecule/requirements.yml') }}

      # community.docker drives the container itself, so a missing one fails
      # `create` before any role code runs — an error that reads like a broken
      # scenario rather than a missing collection.
      - name: Install the scenarios' collections
        run: ansible-galaxy collection install -r molecule/requirements.yml

      - name: The collection's own dependencies
        run: ansible-galaxy collection install -r requirements.yml

      # `test` rather than `converge`: the sequence includes idempotence, which
      # is the promise this whole job exists to keep honest.
      - name: molecule test
        run: molecule test --scenario-name "${{ matrix.scenario }}"
