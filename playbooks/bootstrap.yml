---
# First contact with a brand new machine, run once as root before anything else:
#
#   ansible-playbook playbooks/bootstrap.yml -l <host> -u root -k
#
# Afterwards every other playbook connects as the operator account this creates.
# Requires an unlocked Bitwarden CLI (skill /bw-unlock) on the control machine.
- name: Bootstrap SSH access on a bare host
  hosts: all
  gather_facts: true

  vars:
    bootstrap_user: "{{ krot_user }}"
    bootstrap_user_shell: "{{ krot_user_shell }}"
    bootstrap_authorized_keys: "{{ krot_ssh_public_keys }}"
    # BW_SESSION wins when exported; otherwise fall back to the cache the
    # bw-unlock skill writes.
    krot_bw_session: "{{ lookup('ansible.builtin.env', 'BW_SESSION')
                         | default(lookup('ansible.builtin.file',
                                          '/tmp/bw-' ~ lookup('ansible.builtin.env', 'USER') ~ '/session'),
                                   true) }}"

  pre_tasks:
    # Read on the control machine, not the target: the target has no Bitwarden
    # session and must never be handed one.
    - name: Read the operator's public key from Bitwarden
      ansible.builtin.command:
        argv:
          - bw
          - get
          - notes
          - "{{ krot_ssh_key_bw_item }}"
          - --session
          - "{{ krot_bw_session }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      register: krot_bw_key
      # Read-only, so it runs under --check too; otherwise the assert in the role
      # sees an empty key list and a check run fails on a healthy setup.
      check_mode: false
      no_log: true

    - name: Collect the public keys to install
      ansible.builtin.set_fact:
        krot_ssh_public_keys: "{{ krot_bw_key.stdout_lines | map('trim') | select | list }}"

  roles:
    - role: bootstrap
