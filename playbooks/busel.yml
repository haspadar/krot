---
# The recipient machine: several sites behind Cloudflare on one system
# php-fpm/postgresql/nginx stack.
#
#   ansible-playbook playbooks/busel.yml
#
# Roles are independent — apply one with --tags, e.g. --tags nginx.
- name: Provision the busel recipient machine
  hosts: recipients
  gather_facts: true

  roles:
    - role: common
      vars:
        common_hostname: "{{ krot_hostname }}"
        common_timezone: "{{ krot_timezone }}"
      tags: [common]

    - role: php
      tags: [php]

    - role: postgresql
      tags: [postgresql]

    - role: nginx
      vars:
        nginx_deploy_root: "{{ busel_deploy_path }}"
        nginx_deploy_user: "{{ krot_user }}"
      tags: [nginx]

    # Last: the CF lock closes 80/443 to everything but Cloudflare, so it runs
    # once the services it protects are actually up.
    - role: firewall
      tags: [firewall]

    - role: fail2ban
      tags: [fail2ban]
