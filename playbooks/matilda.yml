---
# The donor machine: a bare host prepared for Matilda's docker compose stack.
# No PHP, PostgreSQL or nginx here — compose.yaml owns all of that.
#
#   ansible-playbook playbooks/matilda.yml
- name: Provision the matilda donor machine
  hosts: donors
  gather_facts: true

  roles:
    - role: common
      vars:
        common_hostname: "{{ krot_hostname }}"
        common_timezone: "{{ krot_timezone }}"
      tags: [common]

    - role: docker
      tags: [docker]

    - role: firewall
      tags: [firewall]

    - role: fail2ban
      tags: [fail2ban]
